name: Build and security checks
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: node --test scripts/post-needs-build.test.mjs
      - run: node --test scripts/published-feed.test.mjs
      - run: npm run build
      - name: SEO validation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: seo-validation
          path: |
            output/seo-p0-p1/validation.json
            output/seo-p2-p3/content-inventory.json
            output/seo-p2-p3/build-validation.json
          if-no-files-found: ignore
          retention-days: 30
