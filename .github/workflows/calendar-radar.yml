name: Naptár forrásfigyelő
on:
  schedule:
    # Daily, including Monday / Wednesday / Friday before the publication build.
    - cron: '17 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: calendar-radar
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .calendar-radar/state.json
          key: calendar-radar-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: calendar-radar-v1-
      - run: npm run radar:check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: calendar-radar
          path: .calendar-radar/
          include-hidden-files: true
          retention-days: 90
      - name: Szerkesztői ellenőrzőlista frissítése
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-radar-report.mjs
