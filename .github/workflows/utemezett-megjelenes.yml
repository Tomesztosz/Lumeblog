# Ütemezett megjelenés.
#
# Az oldal statikus: a fájlok akkor készülnek el, amikor buildelünk. Ha egy
# cikk vasárnap kerül fel, de hétfői dátummal, akkor hétfőn valakinek kérnie
# kell egy újraépítést, különben a vasárnapi állapot marad kint.
#
# Ez a munkafolyamat minden reggel megnézi, hogy van-e aznapra datált cikk,
# vagy változik-e a megjelenési naptár valamelyik elemének állapota. Csak
# ilyen határnapon kér újraépítést, így a naptár magától frissül, de nem
# szemeteljük tele a naplót fölösleges commitokkal.
#
# A push maga indítja a Cloudflare buildjét, mint bármelyik másik push.

name: Ütemezett megjelenés

on:
  schedule:
    # Budapest 01:00: nyáron előző nap 23:00 UTC, télen 00:00 UTC.
    # Mindkét UTC-időpontban ellenőrzünk; a cikk a dátuma előtt nem kerül ki.
    # A 03:00 UTC-s reggeli ellenőrzés tartalék és a régi cikkidőpontokat is kezeli.
    # A GitHub futás és a Cloudflare build késhet; ez nem percre pontos garancia.
    - cron: '0 0,23 * * *'
    - cron: '0 3 * * *'
  # Kézzel is indítható a GitHub felületén (Actions → Run workflow),
  # ha valamit azonnal ki kell tenni.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  megjelenes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Kell-e ma újraépíteni az oldalt?
        id: ellenorzes
        run: |
          MA=$(TZ=Europe/Budapest date +%F)
          TEGNAP=$(TZ=Europe/Budapest date -d yesterday +%F)
          echo "Mai dátum (Budapest): $MA"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Kézi indítás: az oldal újraépül."
            echo "talalat=igen" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if node scripts/post-needs-build.mjs; then
            echo "Ma jelenik meg cikk."
            echo "talalat=igen" >> "$GITHUB_OUTPUT"
            exit 0
          else
            STATUS=$?
            if [ "$STATUS" -ne 1 ]; then
              echo "Hibás cikkdátum; az ellenőrzés nem folytatható."
              exit "$STATUS"
            fi
          fi

          if node scripts/calendar-needs-build.mjs; then
            echo "Ma változik egy naptárbejegyzés állapota vagy 60 napos láthatósága."
            echo "talalat=igen" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if grep -Fq "\"dateEnd\": \"$TEGNAP\"" src/data/releases.json; then
            echo "Ma kerül archívumba egy naptárbejegyzés."
            echo "talalat=igen" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Ma nincs cikk- vagy naptárváltás."
          echo "talalat=nem" >> "$GITHUB_OUTPUT"

      - name: Újraépítés kérése
        if: steps.ellenorzes.outputs.talalat == 'igen'
        run: |
          git config user.name "Lume ütemező"
          git config user.email "actions@users.noreply.github.com"
          git commit --allow-empty -m "Ütemezett frissítés: $(date -u +%F)"
          git push
