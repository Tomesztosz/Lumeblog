<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<title>Lume telefontok</title>
<style>
  @font-face { font-family: 'Fraunces'; font-weight: 100 900; font-style: normal;
    src: url('../../../node_modules/@fontsource-variable/fraunces/files/fraunces-latin-opsz-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Fraunces'; font-weight: 100 900; font-style: normal; unicode-range: U+0100-024F, U+1E00-1EFF;
    src: url('../../../node_modules/@fontsource-variable/fraunces/files/fraunces-latin-ext-opsz-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Plex Mono'; font-weight: 500;
    src: url('../../../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-500-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Plex Mono'; font-weight: 500; unicode-range: U+0100-024F, U+1E00-1EFF;
    src: url('../../../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-ext-500-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Hanken'; font-weight: 100 900;
    src: url('../../../node_modules/@fontsource-variable/hanken-grotesk/files/hanken-grotesk-latin-wght-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Hanken'; font-weight: 100 900; unicode-range: U+0100-024F, U+1E00-1EFF;
    src: url('../../../node_modules/@fontsource-variable/hanken-grotesk/files/hanken-grotesk-latin-ext-wght-normal.woff2') format('woff2'); }
  html, body { margin: 0; background: transparent; }
  svg { display: block; }
</style>
</head>
<body>
<svg id="s" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
/* ============================================================
   LUME TELEFONTOK · iPhone 16 Pro, RhinoShield SolidSuit
   Minden méret milliméterben. A tok hátlapja kb. 75 × 150 mm.
   Tiltott zóna: a kamera körüli perem (bal felső sarok).
   A MagSafe-gyűrű kb. a hátlap közepén van: nem igazítunk hozzá semmit.
   ============================================================ */
const CASE_W = 75, CASE_H = 150;
const CAM = { x: 3, y: 3, w: 43, h: 44, r: 10.5 };

const INK = {
  ink: '#242722',      // Lume tinta
  brass: '#75613b',    // a pont, világos tokon
  paper: '#efece2',    // krém, sötét tokon
  lume: '#d7eb96',     // halvány lume-zöld (nem neon), sötét tokon
};

const CASES = {
  beige: { name: 'Shell Beige', fill: '#d6d0c3' },
  white: { name: 'Fehér', fill: '#f1f1ef' },
  grey: { name: 'Szürke', fill: '#a7aeb5' },
  olive: { name: 'Olívazöld', fill: '#68704f' },
  black: { name: 'Fekete', fill: '#1d1e1d' },
  navy: { name: 'Sötétkék', fill: '#3a4f7a' },
};

/* A tervek. A színeket a hívó adja meg (világos vagy sötét tok). */
const DESIGNS = {
  'nagy': { title: 'Nagy', note: 'A teljes szélességben, alul', draw: (g, c) =>
      wordmark(g, { width: 61, cx: CASE_W / 2, baseline: 139, opsz: 36, weight: 500, ink: c.ink, dot: c.dot, th: c.th }) },
  'fuggoleges': { title: 'Függőleges', note: 'A jobb szélen, alulról felfelé', draw: (g, c) =>
      wordmark(g, { width: 86, cx: 0, baseline: 0, opsz: 36, weight: 500, ink: c.ink, dot: c.dot, th: c.th,
                    transform: `translate(${CASE_W - 8.2} ${144}) rotate(-90)`, anchorStart: true }) },
  'kicsi': { title: 'Kicsi', note: 'Középen, a MagSafe alatt', draw: (g, c) =>
      wordmark(g, { width: 27, cx: CASE_W / 2, baseline: 126, opsz: 9, weight: 780, ink: c.ink, dot: c.dot, th: c.th }) },
  'motto': { title: 'Kicsi + mottó', note: '„Órák. Közelről.”', draw: (g, c) => {
      wordmark(g, { width: 27, cx: CASE_W / 2, baseline: 121, opsz: 9, weight: 780, ink: c.ink, dot: c.dot, th: c.th });
      mono(g, { text: 'ÓRÁK. KÖZELRŐL.', size: 4.1, cx: CASE_W / 2, baseline: 132.5, spacing: 0.13, ink: c.ink });
  } },
  'sarok': { title: 'Sarokjelzés', note: 'Lent: LUME és az alapítás éve', draw: (g, c) => {
      wordmark(g, { width: 21, x: 9, baseline: 141, opsz: 9, weight: 780, ink: c.ink, dot: c.dot, th: c.th });
      mono(g, { text: 'EST. MMXXVI', size: 4.1, right: CASE_W - 9, baseline: 141, spacing: 0.12, ink: c.ink });
  } },
  'ritkitott': { title: 'Ritkított', note: 'Széles betűköz, mint a Reel záróképén', draw: (g, c) =>
      spaced(g, { text: 'LUME', width: 44, cx: CASE_W / 2, baseline: 128, opsz: 24, weight: 520, ink: c.ink, dot: c.dot, th: c.th }) },
};

/* ---------- betűkészítők ---------- */
const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}

/* A web logója: Fraunces 500, -0.09em betűköz, utána a kis pont. */
function wordmark(g, o) {
  const grp = el('g', o.transform ? { transform: o.transform } : {}, g);
  const t = el('text', {
    'font-family': 'Fraunces', 'font-weight': o.weight, fill: o.ink, 'font-size': 10,
    style: `font-variation-settings: 'opsz' ${o.opsz}; letter-spacing: -0.06em`,
    ...thick(o),
  }, grp);
  t.textContent = 'LUME';
  // a méretet a kívánt szélességhez igazítjuk (szöveg + pont együtt)
  let fs = 10;
  for (let i = 0; i < 6; i++) {
    t.setAttribute('font-size', fs);
    const w = inkWidth(t) + fs * 0.1 + Math.max(fs * 0.08, 1.3);
    fs *= o.width / w;
  }
  t.setAttribute('font-size', fs);
  const dr = Math.max(fs * 0.04, 0.65);
  const total = inkWidth(t) + fs * 0.1 + 2 * dr;
  const x0 = o.anchorStart ? 0 : (o.x != null ? o.x : o.cx - total / 2);
  t.setAttribute('x', x0 - inkLeft(t, 0));
  t.setAttribute('y', o.baseline);
  const right = x0 + inkWidth(t);
  if (o.dot) {
    el('circle', { cx: right + fs * 0.1 + dr, cy: o.baseline - Math.max(fs * 0.19, dr + 0.2), r: dr, fill: o.dot }, grp);
  }
  return grp;
}

function spaced(g, o) {
  const t = el('text', {
    'font-family': 'Fraunces', 'font-weight': o.weight, fill: o.ink, 'font-size': 10,
    style: `font-variation-settings: 'opsz' ${o.opsz}; letter-spacing: 0.32em`,
    ...thick(o),
  }, g);
  t.textContent = o.text;
  let fs = 10;
  for (let i = 0; i < 6; i++) { t.setAttribute('font-size', fs); fs *= o.width / inkWidth(t); }
  t.setAttribute('font-size', fs);
  const x0 = o.cx - inkWidth(t) / 2;
  t.setAttribute('x', x0 - inkLeft(t, 0));
  t.setAttribute('y', o.baseline);
  if (o.dot) el('circle', { cx: o.cx, cy: o.baseline + fs * 0.45, r: Math.max(fs * 0.05, 0.7), fill: o.dot }, g);
}

function mono(g, o) {
  const t = el('text', {
    'font-family': 'Hanken', 'font-weight': 820, fill: o.ink, 'font-size': o.size,
    style: `letter-spacing: ${o.spacing}em`,
    ...thick({ ink: o.ink, th: 0.2 }),
  }, g);
  t.textContent = o.text;
  const w = inkWidth(t);
  const x0 = o.right != null ? o.right - w : o.cx - w / 2;
  t.setAttribute('x', x0 - inkLeft(t, 0));
  t.setAttribute('y', o.baseline);
}

/* Vastagítás: azonos színű körvonal. A vékony hajszálvonalakat és talpakat
   a nyomtatáshoz szükséges 0,7 mm fölé emeli, a betűforma nem változik. */
function thick(o) {
  return o.th ? { stroke: o.ink, 'stroke-width': o.th, 'stroke-linejoin': 'round', 'paint-order': 'stroke' } : {};
}

/* A tényleges festett szélesség (az utolsó betű utáni betűköz nélkül). */
function inkWidth(t) {
  const n = t.getNumberOfChars();
  const first = t.getExtentOfChar(0), last = t.getExtentOfChar(n - 1);
  const ls = parseFloat(getComputedStyle(t).letterSpacing) || 0;
  return (last.x + last.width - ls) - first.x;
}
function inkLeft(t) { return t.getExtentOfChar(0).x - (parseFloat(t.getAttribute('x')) || 0); }

/* ---------- jelenetek ---------- */
const PX_PER_MM = 24; // 610 dpi
function setup(w, h) {
  const s = document.getElementById('s');
  s.innerHTML = '';
  s.setAttribute('width', w * PX_PER_MM); s.setAttribute('height', h * PX_PER_MM);
  s.setAttribute('viewBox', `0 0 ${w} ${h}`);
  return s;
}

/* Nyomdai fájl: átlátszó háttér, csak a minta, a tok teljes méretében. */
window.printFile = (id, tone, th = 0) => {
  const s = setup(CASE_W, CASE_H);
  DESIGNS[id].draw(s, colors(tone, th));
};

/* Látványterv: a tok színe, kamera, finom fény, rajta a minta. */
window.mockup = (id, caseKey, tone, th = 0) => {
  const M = 10, s = setup(CASE_W + 2 * M, CASE_H + 2 * M);
  const c = CASES[caseKey];
  const defs = el('defs', {}, s);
  const sh = el('linearGradient', { id: 'sh', x1: 0, y1: 0, x2: 1, y2: 0 }, defs);
  el('stop', { offset: 0, 'stop-color': '#fff', 'stop-opacity': 0.22 }, sh);
  el('stop', { offset: 0.12, 'stop-color': '#fff', 'stop-opacity': 0.0 }, sh);
  el('stop', { offset: 0.9, 'stop-color': '#000', 'stop-opacity': 0.0 }, sh);
  el('stop', { offset: 1, 'stop-color': '#000', 'stop-opacity': 0.16 }, sh);
  const blur = el('filter', { id: 'bl', x: -0.2, y: -0.2, width: 1.4, height: 1.4 }, defs);
  el('feGaussianBlur', { stdDeviation: 2.2 }, blur);

  const g = el('g', { transform: `translate(${M} ${M})` }, s);
  el('rect', { x: 1.5, y: 3, width: CASE_W, height: CASE_H, rx: 12, fill: '#000', opacity: 0.18, filter: 'url(#bl)' }, g);
  el('rect', { x: 0, y: 0, width: CASE_W, height: CASE_H, rx: 12, fill: c.fill }, g);

  DESIGNS[id].draw(g, colors(tone, th));

  // kamera: a tok pereme, benne a telefon kameraszigete
  el('rect', { x: CAM.x - 0.4, y: CAM.y + 0.6, width: CAM.w, height: CAM.h, rx: CAM.r, fill: '#000', opacity: 0.18, filter: 'url(#bl)' }, g);
  el('rect', { x: CAM.x, y: CAM.y, width: CAM.w, height: CAM.h, rx: CAM.r, fill: c.fill, stroke: '#000', 'stroke-opacity': 0.12, 'stroke-width': 0.35 }, g);
  el('rect', { x: CAM.x + 3.6, y: CAM.y + 3.6, width: CAM.w - 7.2, height: CAM.h - 7.2, rx: 7.2, fill: '#e7e6e2' }, g);
  const lens = (x, y, r) => {
    el('circle', { cx: x, cy: y, r: r + 0.9, fill: '#c9c9c6' }, g);
    el('circle', { cx: x, cy: y, r, fill: '#121313' }, g);
    el('circle', { cx: x, cy: y, r: r * 0.55, fill: '#1d2124' }, g);
    el('circle', { cx: x - r * 0.25, cy: y - r * 0.3, r: r * 0.16, fill: '#3b4652' }, g);
  };
  lens(CAM.x + 12.4, CAM.y + 12.4, 6.6);
  lens(CAM.x + 29.2, CAM.y + 22.2, 6.6);
  lens(CAM.x + 12.4, CAM.y + 31.8, 6.6);
  el('circle', { cx: CAM.x + 29.6, cy: CAM.y + 9.2, r: 2.6, fill: '#f3f0e6', stroke: '#c8c6bf', 'stroke-width': 0.4 }, g);
  el('circle', { cx: CAM.x + 29.6, cy: CAM.y + 35.2, r: 2.1, fill: '#1a1b1b' }, g);

  el('rect', { x: 0, y: 0, width: CASE_W, height: CASE_H, rx: 12, fill: 'url(#sh)' }, g);
};

function colors(tone, th = 0) {
  return tone === 'dark'
    ? { ink: INK.paper, dot: INK.lume, th }
    : { ink: INK.ink, dot: INK.brass, th };
}

window.DESIGNS_META = Object.fromEntries(Object.entries(DESIGNS).map(([k, v]) => [k, { title: v.title, note: v.note }]));
window.CASES_META = CASES;
window.PX_PER_MM = PX_PER_MM;

document.fonts.load("500 20px 'Fraunces'", 'LUMEŐ').then(() => document.fonts.load("500 20px 'Plex Mono'", 'ÓŐ')).then(() => {
  window.READY = true;
});
</script>
</body>
</html>
