<title>Az oszlopkerék működés közben</title>
<style>

   beágyazott iframe sem teheti meg helyette. */

:root{
  --paper:#E6DAC1; --paper-2:#EFE6D2; --ink:#2A231D; --ink-soft:#6A5E50;
  --line:rgba(42,35,29,0.16); --line-soft:rgba(42,35,29,0.10);
  --brass:#8F6E31; --brass-deep:#6F5424; --lume:#7B885A; --lume-bright:#8FA857;
  --dial:#F1E9D6; --plate:#EAE0CC; --col-side:#5C6743; --col-top:#9DAA6E;
  --font-serif:'Fraunces Variable',Georgia,serif;
  --font-sans:'Hanken Grotesk Variable',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{ box-sizing:border-box; }
body{ margin:0; padding:0; background:transparent; color:var(--ink);
  font-family:var(--font-sans); -webkit-font-smoothing:antialiased;
  transition:color .5s ease; }
.card{ max-width:760px; margin:0 auto; background:var(--paper-2); border:1px solid var(--line);
  border-radius:6px; padding:26px 26px 22px; transition:background-color .5s ease, border-color .5s ease; }
h1{ font-family:var(--font-serif); font-weight:600; font-size:22px; letter-spacing:-.01em; margin:0 0 4px; }
.sub{ font-size:14px; color:var(--ink-soft); margin:0 0 14px; max-width:58ch; }
svg.rig{ width:100%; height:auto; display:block; overflow:visible; }

.plate{ fill:var(--plate); stroke:var(--line); stroke-width:1; }
.ctx{ opacity:.16; }
.ctx-ring{ fill:none; stroke:var(--brass-deep); stroke-width:2; }
.ctx-tooth{ stroke:var(--brass-deep); stroke-width:2; }

.disc-side{ fill:var(--brass-deep); }
.disc-top{ fill:var(--dial); stroke:var(--brass); stroke-width:2; }
.disc-groove{ fill:none; stroke:var(--brass-deep); stroke-width:1; opacity:.3; }
.hub{ fill:var(--brass); } .hub-screw{ fill:var(--brass-deep); }

.pcol-body{ fill:var(--lume); stroke:var(--col-side); stroke-width:1; transition:filter .35s; }
.pcol-body.mark{ fill:var(--brass); stroke:var(--brass-deep); }
.pcol-top{ fill:var(--col-top); stroke:var(--col-side); stroke-width:.8; }
.pcol-top.mark{ fill:#C0A461; }
.is-engaged .pcol-body{ filter:drop-shadow(0 0 3px color-mix(in srgb,var(--lume-bright) 45%,transparent)); }

.pcol-shadow{ fill:rgba(42,35,29,0.22); }
.beak-roller{ fill:var(--brass-deep); stroke:var(--ink); stroke-width:1; }
.is-engaged .beak-roller{ fill:var(--lume-bright); }
.lever-arm{ stroke:var(--ink); stroke-width:8; stroke-linecap:round; }
.beak{ fill:var(--brass-deep); }
.beak-glow{ transition:fill .35s, filter .35s; }
.is-engaged .beak-glow{ fill:var(--lume-bright); filter:drop-shadow(0 0 5px color-mix(in srgb,var(--lume-bright) 65%,transparent)); }
.mount{ fill:var(--brass-deep); }

.link{ stroke:var(--ink-soft); stroke-width:1.4; stroke-dasharray:3 3; opacity:.6; }
.clutch{ fill:none; stroke:var(--ink-soft); stroke-width:2.4; transition:stroke .35s, filter .35s; }
.is-engaged .clutch{ stroke:var(--lume-bright); filter:drop-shadow(0 0 5px color-mix(in srgb,var(--lume-bright) 65%,transparent)); }

.dial-face{ fill:var(--dial); stroke:var(--brass); stroke-width:2; }
.tick{ stroke:var(--ink-soft); } .gear{ fill:none; stroke:var(--brass-deep); stroke-width:1; opacity:.3; }
.hand{ fill:var(--brass-deep); transition:fill .3s; } .is-engaged .hand{ fill:var(--lume); }
.hand-tip{ fill:var(--lume); } .is-engaged .hand-tip{ filter:drop-shadow(0 0 4px color-mix(in srgb,var(--lume-bright) 70%,transparent)); }
.cap{ fill:var(--brass); } .heart{ fill:var(--brass-deep); }
.hammer-arm{ stroke:var(--ink); stroke-width:6; stroke-linecap:round; } .hammer-head{ fill:var(--ink); }

.lbl{ font-family:var(--font-mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; fill:var(--ink-soft); }
.lead{ stroke:var(--ink-soft); stroke-width:.8; opacity:.45; stroke-dasharray:2 3; }

.controls{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-top:14px; }
.status{ font-family:var(--font-mono); font-size:12px; letter-spacing:.12em; text-transform:uppercase; padding:8px 14px; border-radius:999px; border:1px solid var(--line); color:var(--ink-soft); background:var(--paper); min-width:120px; text-align:center; transition:all .3s; }
.status.run{ color:var(--brass-deep); border-color:var(--lume-bright); background:color-mix(in srgb,var(--lume-bright) 12%, var(--paper)); }
.btn{ font-family:var(--font-sans); font-weight:600; font-size:14px; cursor:pointer; padding:11px 18px; border-radius:3px; line-height:1; border:1px solid var(--ink); background:var(--ink); color:var(--paper); transition:transform .18s,background .25s,color .25s; }
.btn:hover{ transform:translateY(-1px); } .btn.ghost{ background:transparent; color:var(--ink); border-color:var(--line); }
.btn.ghost:hover{ border-color:var(--brass); color:var(--brass-deep); } .btn:focus-visible{ outline:2px solid var(--brass); outline-offset:2px; }
.hint{ font-size:12.5px; color:var(--brass-deep); min-height:18px; opacity:0; transition:opacity .3s; margin-top:8px; } .hint.show{ opacity:1; }
.legend{ display:flex; gap:18px; flex-wrap:wrap; margin-top:12px; font-size:12px; color:var(--ink-soft); }
.legend span{ display:inline-flex; align-items:center; gap:7px; } .dot{ width:11px; height:11px; border-radius:50%; display:inline-block; }
.dot.on{ background:var(--lume-bright); box-shadow:0 0 5px color-mix(in srgb,var(--lume-bright) 60%,transparent); } .dot.off{ background:var(--ink-soft); opacity:.5; }
.note{ margin-top:12px; font-size:11.5px; color:var(--ink-soft); border-top:1px solid var(--line-soft); padding-top:12px; }

/* Beágyazva a napló saját „lámpa le" kapcsolója vezérli — ne legyen két gomb. */
.embedded #darkBtn{ display:none; }

/* ---- lámpa le (sötét, derengő) mód ---- */
body.dark{
  --paper:#13100B; --paper-2:#1B1610; --ink:#B6AB94; --ink-soft:#7E7461;
  --line:rgba(198,186,160,0.14); --line-soft:rgba(198,186,160,0.07);
  --brass:#8A6C34; --brass-deep:#6E5528; --lume:#8DA85E; --lume-bright:#CDE9A0;
  --dial:#0E0B07; --plate:#17130F; --col-side:#2f3a1c; --col-top:#B7D488;
}
body.dark .pcol-body{ fill:var(--lume-bright); stroke:#2f3a1c; filter:drop-shadow(0 0 4px color-mix(in srgb,var(--lume-bright) 42%,transparent)); }
body.dark .pcol-top{ fill:#DCF0AF; }
body.dark .pcol-body.mark{ fill:var(--brass); stroke:var(--brass-deep); filter:none; }
body.dark .pcol-top.mark{ fill:#C9A968; }
body.dark .beak-roller{ fill:var(--lume-bright); filter:drop-shadow(0 0 5px color-mix(in srgb,var(--lume-bright) 60%,transparent)); }
body.dark .beak-glow{ fill:var(--lume-bright); }
body.dark .hand, body.dark .hand-tip{ fill:var(--lume-bright); }
body.dark .is-engaged .hand-tip{ filter:drop-shadow(0 0 5px color-mix(in srgb,var(--lume-bright) 75%,transparent)); }
body.dark .is-engaged .clutch{ stroke:var(--lume-bright); filter:drop-shadow(0 0 5px color-mix(in srgb,var(--lume-bright) 60%,transparent)); }
body.dark .disc-top{ stroke:var(--brass); }
body.dark .btn{ background:transparent; color:var(--lume-bright); border-color:color-mix(in srgb,var(--lume-bright) 45%,transparent); }
body.dark .btn.ghost{ color:var(--ink); border-color:var(--line); }

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
}
</style>
</head>
<body>
<div class="card">
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>

  <svg class="rig" id="rig" viewBox="0 0 720 400" role="img" aria-label="">
    <rect class="plate" x="16" y="24" width="688" height="352" rx="16"/>
    <g class="ctx" id="ctxgear"></g>

    <text class="lbl" id="lblWheel" x="250" y="352" text-anchor="middle"></text>
    <text class="lbl" id="lblLever" x="368" y="150" text-anchor="middle"></text>
    <line class="lead" x1="368" y1="158" x2="360" y2="212"/>
    <text class="lbl" id="lblClutch" x="500" y="128" text-anchor="middle"></text>
    <line class="lead" x1="500" y1="136" x2="500" y2="196"/>
    <text class="lbl" id="lblHand" x="600" y="250" text-anchor="middle"></text>
    <text class="lbl" id="lblHammer" x="600" y="70" text-anchor="middle"></text>

    <!-- disc (tilted, seated) -->
    <path class="disc-side" d="M130 210 L130 226 A120 60 0 0 0 370 226 L370 210 A120 60 0 0 1 130 210 Z"/>
    <ellipse class="disc-top" cx="250" cy="210" rx="120" ry="60"/>
    <ellipse class="disc-groove" cx="250" cy="210" rx="92" ry="44"/>
    <ellipse class="disc-groove" cx="250" cy="210" rx="70" ry="34"/>
    <ellipse class="hub" cx="250" cy="210" rx="18" ry="10"/>
    <circle class="hub-screw" cx="250" cy="210" r="4"/>

    <!-- pillars (positioned by JS) -->
    <g id="pillars"></g>

    <!-- coupling lever -->
    <line id="arm" class="lever-arm" x1="250" y1="233" x2="430" y2="250"/>
    <rect class="mount" x="424" y="240" width="12" height="22" rx="3"/>
    <g id="beak"><rect class="beak beak-glow" x="-3" y="-16" width="6" height="16" rx="3"/><circle class="beak-roller" cx="0" cy="0" r="6"/></g>

    <!-- clutch -->
    <line class="link" x1="436" y1="250" x2="470" y2="220"/>
    <g class="clutch"><circle cx="484" cy="210" r="10"/><circle cx="498" cy="210" r="10"/></g>
    <line class="link" x1="510" y1="205" x2="548" y2="188"/>

    <!-- register -->
    <g>
      <circle class="dial-face" cx="600" cy="178" r="50"/>
      <circle class="gear" cx="600" cy="178" r="42"/>
      <g id="ticks"></g>
      <path class="heart" d="M600 175 c -4 -6 -13 -2 -13 3 c 0 5 9 10 13 14 c 4 -4 13 -9 13 -14 c 0 -6 -9 -9 -13 -3 z"/>
      <g id="chand"><rect class="hand" x="597.5" y="134" width="5" height="48" rx="2.5"/><rect class="hand-tip" x="597" y="134" width="6" height="13" rx="3"/></g>
      <circle class="cap" cx="600" cy="178" r="5"/>
    </g>

    <!-- reset hammer -->
    <g id="hammer"><line class="hammer-arm" x1="600" y1="86" x2="600" y2="150"/><rect class="hammer-head" x="592" y="146" width="16" height="11" rx="3"/></g>
    <circle class="mount" cx="600" cy="84" r="4"/>
  </svg>

  <div class="controls">
    <div class="status" id="status"></div>
    <button class="btn" id="startBtn"></button>
    <button class="btn ghost" id="resetBtn"></button>
    <button class="btn ghost" id="darkBtn"></button>
  </div>
  <div class="hint" id="hint"></div>

  <div class="legend">
    <span><i class="dot on"></i> <span id="legOn"></span></span>
    <span><i class="dot off"></i> <span id="legOff"></span></span>
  </div>
  <p class="note" id="note"></p>
</div>

<script>
(function(){
  var NS="http://www.w3.org/2000/svg";

  /* ---------- kétnyelvűség: /widgets/oszlopkerek.html?lang=en ---------- */
  var LANG = (new URLSearchParams(location.search).get('lang') === 'en') ? 'en' : 'hu';
  var T = {
    hu: {
      title:'Az oszlopkerék működés közben',
      sub:'Az oszlopok felfelé álló pillérek. Nyomd meg a <b>Start / Stop</b> gombot: a kerék egy lépést fordul, és a kapcsolókar csőre vagy <b>rááll egy pillér tetejére</b> (kikapcsol), vagy <b>lepottyan a pillérek közé</b> a résbe (bekapcsol). Ettől fut vagy áll a mutató. A <b>Nullázás</b> csak megállított állapotban működik.',
      aria:'Az oszlopkerekes kronográf sematikus, térbeli modellje',
      wheel:'Oszlopkerék (pillérek)', lever:'Kapcsolókar', clutch:'Tengelykapcsoló',
      hand:'Kronográf-mutató', hammer:'Kalapács',
      start:'Start / Stop', reset:'Nullázás', lightsOff:'Lámpa le', lightsOn:'Lámpa fel',
      running:'Fut', stopped:'Áll', zero:'Áll · nullán',
      hint:'Futás közben nem lehet nullázni. Előbb állítsd meg.',
      legOn:'Bekapcsolva (a csőr a pillérek közt, a résben)',
      legOff:'Kikapcsolva (a csőr egy pillér tetején)',
      note:'Stílusos, tanító célú térbeli modell: a viselkedés és az elv pontos, nem egy konkrét kaliber fotórealisztikus rajza.'
    },
    en: {
      title:'The column wheel at work',
      sub:'The columns are upright pillars. Press <b>Start / Stop</b>: the wheel turns one step, and the coupling lever’s beak either <b>rises onto the top of a pillar</b> (disengaged) or <b>drops into the gap</b> between two (engaged). That is what makes the hand run or stop. <b>Reset</b> only works when stopped.',
      aria:'Schematic three-dimensional model of a column-wheel chronograph',
      wheel:'Column wheel (pillars)', lever:'Coupling lever', clutch:'Clutch',
      hand:'Chronograph hand', hammer:'Hammer',
      start:'Start / Stop', reset:'Reset', lightsOff:'Lights off', lightsOn:'Lights on',
      running:'Running', stopped:'Stopped', zero:'Stopped · at zero',
      hint:'You cannot reset while it is running. Stop it first.',
      legOn:'Engaged (beak in the gap between pillars)',
      legOff:'Disengaged (beak on top of a pillar)',
      note:'A stylised, teaching model: the behaviour and the principle are accurate, but this is not a photorealistic drawing of any one calibre.'
    }
  }[LANG];

  document.documentElement.lang = LANG;
  document.getElementById('title').textContent = T.title;
  document.getElementById('sub').innerHTML = T.sub;
  document.getElementById('rig').setAttribute('aria-label', T.aria);
  document.getElementById('lblWheel').textContent = T.wheel;
  document.getElementById('lblLever').textContent = T.lever;
  document.getElementById('lblClutch').textContent = T.clutch;
  document.getElementById('lblHand').textContent = T.hand;
  document.getElementById('lblHammer').textContent = T.hammer;
  document.getElementById('startBtn').textContent = T.start;
  document.getElementById('resetBtn').textContent = T.reset;
  document.getElementById('darkBtn').textContent = T.lightsOff;
  document.getElementById('hint').textContent = T.hint;
  document.getElementById('legOn').textContent = T.legOn;
  document.getElementById('legOff').textContent = T.legOff;
  document.getElementById('note').textContent = T.note;
  document.title = T.title;

  var Wx=250, Wy=210, Rx=92, Ry=44, H=30, Wp=24, N=8;
  var frontY = Wy+Ry;

  var ctx=document.getElementById('ctxgear');
  var ring=document.createElementNS(NS,'ellipse');
  ring.setAttribute('class','ctx-ring'); ring.setAttribute('cx',150); ring.setAttribute('cy',150);
  ring.setAttribute('rx',96); ring.setAttribute('ry',50); ctx.appendChild(ring);
  for(var g=0;g<28;g++){ var a=g*(360/28)*Math.PI/180;
    var tt=document.createElementNS(NS,'line'); tt.setAttribute('class','ctx-tooth');
    tt.setAttribute('x1',150+96*Math.cos(a)); tt.setAttribute('y1',150+50*Math.sin(a));
    tt.setAttribute('x2',150+104*Math.cos(a)); tt.setAttribute('y2',150+54*Math.sin(a)); ctx.appendChild(tt); }

  var tickG=document.getElementById('ticks');
  for(var k=0;k<60;k++){ var big=(k%5===0); var ln=document.createElementNS(NS,'line');
    ln.setAttribute('class','tick'); ln.setAttribute('x1',600); ln.setAttribute('y1',big?132:135);
    ln.setAttribute('x2',600); ln.setAttribute('y2',big?139:137); ln.setAttribute('stroke-width',big?1.4:0.7);
    ln.setAttribute('transform','rotate('+(k*6)+' 600 178)'); tickG.appendChild(ln); }

  var pillarsG=document.getElementById('pillars');
  var pillars=[];
  for(var i=0;i<N;i++){
    var grp=document.createElementNS(NS,'g');
    var sh=document.createElementNS(NS,'ellipse'); sh.setAttribute('class','pcol-shadow');
    var body=document.createElementNS(NS,'rect'); body.setAttribute('class','pcol-body'+(i===0?' mark':'')); body.setAttribute('rx',7);
    var top=document.createElementNS(NS,'ellipse'); top.setAttribute('class','pcol-top'+(i===0?' mark':''));
    grp.appendChild(sh); grp.appendChild(body); grp.appendChild(top); pillarsG.appendChild(grp);
    pillars.push({grp:grp,sh:sh,body:body,top:top,baseY:0});
  }

  var rig=document.getElementById('rig'), arm=document.getElementById('arm'),
      beak=document.getElementById('beak'), chand=document.getElementById('chand'), hammer=document.getElementById('hammer');
  var statusEl=document.getElementById('status'), hintEl=document.getElementById('hint');

  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var SPEED=28, state='zero', step=0;
  var rotCur=90, liftCur=1, hammerCur=0, hammerTarget=0, handAngle=0, lastT=null, resetting=false;

  function engaged(){ return state==='running'; }

  function frame(now){
    var rotTarget=90+step*22.5;
    var liftTarget=engaged()?0:1;
    var k=reduce?1:0.2;
    rotCur += (rotTarget-rotCur)*k;
    liftCur += (liftTarget-liftCur)*k;
    hammerCur += (hammerTarget-hammerCur)*(reduce?1:0.4);

    for(var i=0;i<N;i++){
      var ang=(rotCur + i*(360/N))*Math.PI/180;
      var px=Wx+Rx*Math.cos(ang);
      var by=Wy+Ry*Math.sin(ang);
      var depth=(Math.sin(ang)+1)/2;
      var sc=0.80+0.24*depth;
      var hh=H*sc, ww=Wp*sc;
      var p=pillars[i]; p.baseY=by;
      p.body.setAttribute('x',px-ww/2); p.body.setAttribute('y',by-hh);
      p.body.setAttribute('width',ww); p.body.setAttribute('height',hh);
      p.top.setAttribute('cx',px); p.top.setAttribute('cy',by-hh);
      p.top.setAttribute('rx',ww/2); p.top.setAttribute('ry',ww*0.26);
      p.sh.setAttribute('cx',px); p.sh.setAttribute('cy',by+2);
      p.sh.setAttribute('rx',ww*0.62); p.sh.setAttribute('ry',ww*0.22);
    }
    pillars.slice().sort(function(a,b){return a.baseY-b.baseY;}).forEach(function(p){ pillarsG.appendChild(p.grp); });

    var beakY=frontY - liftCur*(H*1.02);
    beak.setAttribute('transform','translate('+Wx+' '+beakY.toFixed(2)+')');
    arm.setAttribute('y1',beakY.toFixed(2));

    hammer.setAttribute('transform','translate(0 '+hammerCur.toFixed(2)+')');
    if(state==='running' && !resetting){ if(lastT!=null) handAngle=(handAngle+SPEED*(now-lastT)/1000)%360; lastT=now; } else lastT=null;
    chand.setAttribute('transform','rotate('+handAngle.toFixed(2)+' 600 178)');
    rig.classList.toggle('is-engaged', engaged());
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  function updateStatus(){
    if(state==='running'){ statusEl.textContent=T.running; statusEl.classList.add('run'); }
    else if(state==='stopped'){ statusEl.textContent=T.stopped; statusEl.classList.remove('run'); }
    else { statusEl.textContent=T.zero; statusEl.classList.remove('run'); }
  }
  document.getElementById('startBtn').addEventListener('click',function(){
    hintEl.classList.remove('show');
    state = (state==='running') ? 'stopped' : 'running';
    step++; updateStatus();
  });
  document.getElementById('resetBtn').addEventListener('click',function(){
    if(state==='running'){ hintEl.classList.add('show'); setTimeout(function(){hintEl.classList.remove('show');},2400); return; }
    if(resetting) return; resetting=true; hammerTarget=20;
    setTimeout(function(){
      var from=handAngle,t0=performance.now(),dur=reduce?1:240;
      (function snap(n){ var p=Math.min(1,(n-t0)/dur),e=1-Math.pow(1-p,3); handAngle=from*(1-e);
        chand.setAttribute('transform','rotate('+handAngle.toFixed(2)+' 600 178)');
        if(p<1) requestAnimationFrame(snap); else { handAngle=0; hammerTarget=0; state='zero'; resetting=false; updateStatus(); } })(performance.now());
    }, reduce?1:150);
  });

  var darkBtn=document.getElementById('darkBtn');
  function setDark(on){
    document.body.classList.toggle('dark', on);
    darkBtn.textContent = on ? T.lightsOn : T.lightsOff;
  }
  darkBtn.addEventListener('click',function(){ setDark(!document.body.classList.contains('dark')); });
  updateStatus();

  /* ---------- beágyazva: a napló vezérel ---------- */
  var embedded = window.parent !== window;
  if(embedded){
    document.body.classList.add('embedded');

    /* A szülő oldal „lámpa le" kapcsolója ide is átszól. */
    window.addEventListener('message', function(e){
      if(e.source !== window.parent) return;
      if(!e.data || e.data.type !== 'lume:lights') return;
      setDark(!!e.data.dark);
    });

    /* Magasság visszajelzése, hogy ne legyen belső görgetősáv. */
    var lastH = 0;
    function reportHeight(){
      var h = Math.ceil(document.querySelector('.card').getBoundingClientRect().height) + 2;
      if(h !== lastH){ lastH = h; window.parent.postMessage({ type:'lume:height', height:h }, '*'); }
    }
    new ResizeObserver(reportHeight).observe(document.querySelector('.card'));
    window.addEventListener('load', reportHeight);
    reportHeight();

    /* Szóljunk, hogy készen állunk — a szülő ilyenkor küldi el a fény állapotát. */
    window.parent.postMessage({ type:'lume:ready' }, '*');
  }
})();
</script>
