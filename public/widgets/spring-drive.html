<head>

<title>A Spring Drive működés közben</title>
<style>

@font-face{ font-family:'Hanken Grotesk Variable'; font-style:normal; font-weight:100 900; font-display:swap;
  src:url(/fonts/hanken-grotesk-latin-ext-wght-normal.woff2) format('woff2-variations');
  unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }

@font-face{ font-family:'IBM Plex Mono'; font-style:normal; font-weight:400; font-display:swap;
  src:url(/fonts/ibm-plex-mono-latin-ext-400-normal.woff2) format('woff2'); unicode-range:U+0100-02BA,U+1E00-1EFF,U+2020,U+20A0-20AB,U+2C60-2C7F,U+A720-A7FF; }

@font-face{ font-family:'IBM Plex Mono'; font-style:normal; font-weight:500; font-display:swap;

@font-face{ font-family:'IBM Plex Mono'; font-style:normal; font-weight:600; font-display:swap;
  src:url(/fonts/ibm-plex-mono-latin-600-normal.woff2) format('woff2'); unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2122,U+2212; }

  src:url(/fonts/ibm-plex-mono-latin-ext-600-normal.woff2) format('woff2'); unicode-range:U+0100-02BA,U+1E00-1EFF,U+2020,U+20A0-20AB,U+2C60-2C7F,U+A720-A7FF; }

:root{
  --paper:#E6DAC1; --paper-2:#EFE6D2; --ink:#2A231D; --ink-soft:#6A5E50;
  --line:rgba(42,35,29,0.16); --line-soft:rgba(42,35,29,0.10);
  --brass:#8F6E31; --brass-deep:#6F5424; --lume:#7B885A; --lume-bright:#8FA857;
  --dial:#F1E9D6; --plate:#EAE0CC;
  --font-serif:'Fraunces Variable',Georgia,serif;
  --font-sans:'Hanken Grotesk Variable',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{ box-sizing:border-box; }
html, body{ overflow:hidden; }
body{ margin:0; padding:0; background:transparent; color:var(--ink);
  font-family:var(--font-sans); -webkit-font-smoothing:antialiased;
  transition:color .5s ease; }
.card{ max-width:800px; margin:0 auto; background:var(--paper-2); border:1px solid var(--line);
  border-radius:6px; padding:26px 26px 22px; transition:background-color .5s ease, border-color .5s ease; }
h1{ font-family:var(--font-serif); font-weight:600; font-size:22px; letter-spacing:-.01em; margin:0 0 4px; }
.sub{ font-size:14px; color:var(--ink-soft); margin:0 0 14px; max-width:60ch; }
svg.rig{ width:100%; height:auto; display:block; overflow:visible; }

.plate{ fill:var(--plate); stroke:var(--line); stroke-width:1; }
.rim{ fill:none; stroke:url(#brass); stroke-width:8; stroke-dasharray:5 6; }
.disc{ fill:var(--dial); stroke:var(--brass-deep); stroke-width:1.4; }
.hub{ fill:var(--brass); } .hub-in{ fill:var(--brass-deep); }
.spoke{ stroke:var(--brass-deep); stroke-width:3; opacity:.6; }
.spring{ fill:none; stroke:var(--brass-deep); stroke-width:1.6; opacity:.8; }
.glide-rim{ fill:none; stroke:var(--brass); stroke-width:5; }
.glide-face{ fill:var(--dial); stroke:var(--brass-deep); stroke-width:1.4; }
.glide-mark{ fill:var(--lume); }
.is-reg .glide-mark{ fill:var(--lume-bright); }

.coil{ fill:none; stroke:var(--ink-soft); stroke-width:3; transition:stroke .3s, filter .3s; }
.is-reg .coil{ stroke:var(--lume-bright); filter:drop-shadow(0 0 5px color-mix(in srgb,var(--lume-bright) 60%,transparent)); }
.chip{ fill:#2c281f; stroke:var(--brass-deep); stroke-width:1.4; }
.chip-pin{ stroke:var(--ink-soft); stroke-width:2; }
.chip-core{ fill:var(--ink-soft); transition:fill .3s, filter .3s; }
.is-reg .chip-core{ fill:var(--lume-bright); filter:drop-shadow(0 0 5px color-mix(in srgb,var(--lume-bright) 65%,transparent)); }
.xtal{ fill:none; stroke:var(--ink-soft); stroke-width:2; transition:stroke .3s; }
.is-reg .xtal{ stroke:var(--lume-bright); }

.wire{ fill:none; stroke:var(--ink-soft); stroke-width:2.2; opacity:.5; }
.flow{ fill:none; stroke:var(--lume-bright); stroke-width:2.4; stroke-dasharray:5 10; opacity:0; transition:opacity .3s; }
.is-reg .flow{ opacity:1; animation:flow .7s linear infinite; }
@keyframes flow{ to{ stroke-dashoffset:-30; } }
.mech-arrow{ stroke:var(--brass); stroke-width:2.4; fill:none; opacity:.7; marker-end:url(#arr); }

.dialface{ fill:var(--dial); stroke:var(--brass); stroke-width:2; }
.tick{ stroke:var(--ink-soft); }
.hand{ fill:var(--brass-deep); }
.hand-tip{ fill:var(--lume); }
.is-reg .hand, .is-reg .hand-tip{ fill:var(--lume); }
.is-reg .hand-tip{ filter:drop-shadow(0 0 4px color-mix(in srgb,var(--lume-bright) 70%,transparent)); }
.cap{ fill:var(--brass); }

.lbl{ font-family:var(--font-mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; fill:var(--ink-soft); }

.controls{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-top:14px; }
.status{ font-family:var(--font-mono); font-size:11.5px; letter-spacing:.1em; text-transform:uppercase; padding:8px 14px; border-radius:999px; border:1px solid var(--line); color:var(--ink-soft); background:var(--paper); min-width:210px; text-align:center; transition:all .3s; }
.status.ok{ color:var(--brass-deep); border-color:var(--lume-bright); background:color-mix(in srgb,var(--lume-bright) 12%, var(--paper)); }
.status.warn{ color:#9a4a1e; border-color:#c07a3a; background:#f0e2cf; }
.btn{ font-family:var(--font-sans); font-weight:600; font-size:14px; cursor:pointer; padding:11px 16px; border-radius:3px; line-height:1; border:1px solid var(--ink); background:var(--ink); color:var(--paper); transition:transform .18s,background .25s,color .25s; }
.btn:hover{ transform:translateY(-1px); } .btn.ghost{ background:transparent; color:var(--ink); border-color:var(--line); }
.btn.ghost:hover{ border-color:var(--brass); color:var(--brass-deep); } .btn:focus-visible{ outline:2px solid var(--brass); outline-offset:2px; }
.legend{ display:flex; gap:18px; flex-wrap:wrap; margin-top:12px; font-size:12px; color:var(--ink-soft); }
.legend span{ display:inline-flex; align-items:center; gap:7px; }
.swatch{ width:16px; height:6px; border-radius:3px; display:inline-block; }
.sw-mech{ background:var(--brass); } .sw-elec{ background:var(--lume-bright); box-shadow:0 0 5px color-mix(in srgb,var(--lume-bright) 60%,transparent); }
.note{ margin-top:12px; font-size:11.5px; color:var(--ink-soft); border-top:1px solid var(--line-soft); padding-top:12px; }

/* Beágyazva a napló saját „lámpa le" kapcsolója vezérli — ne legyen két gomb. */
.embedded #darkBtn{ display:none; }

body.dark{ --paper:#13100B; --paper-2:#1B1610; --ink:#B6AB94; --ink-soft:#7E7461;
  --line:rgba(198,186,160,0.14); --line-soft:rgba(198,186,160,0.07); --brass:#8A6C34; --brass-deep:#6E5528;
  --lume:#8DA85E; --lume-bright:#CDE9A0; --dial:#0E0B07; --plate:#17130F; }
body.dark .disc, body.dark .glide-face, body.dark .dialface{ stroke:var(--brass); }
body.dark .status.warn{ color:#e0a06a; border-color:#8a5a2a; background:#241a10; }
body.dark .btn{ background:transparent; color:var(--lume-bright); border-color:color-mix(in srgb,var(--lume-bright) 45%,transparent); }
body.dark .btn.ghost{ color:var(--ink); border-color:var(--line); }
@media (prefers-reduced-motion: reduce){ .is-reg .flow{ animation:none; } }
</style>
</head>
<body>
<div class="card">
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>

  <svg class="rig" id="rig" viewBox="0 0 780 400" role="img" aria-label="">
    <defs>
      <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9ba79"/><stop offset="1" stop-color="#5c4720"/></linearGradient>
      <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--brass)"/></marker>
    </defs>
    <rect class="plate" x="14" y="24" width="752" height="352" rx="16"/>

    <text class="lbl" id="lblBarrel" x="118" y="330" text-anchor="middle"></text>
    <text class="lbl" id="lblTrain" x="300" y="118" text-anchor="middle"></text>
    <text class="lbl" id="lblGlide" x="452" y="112" text-anchor="middle"></text>
    <text class="lbl" id="lblCoil" x="452" y="340" text-anchor="middle"></text>
    <text class="lbl" id="lblChip" x="648" y="112" text-anchor="middle"></text>
    <text class="lbl" id="lblHand" x="662" y="366" text-anchor="middle"></text>

    <!-- mechanical flow arrows -->
    <path class="mech-arrow" d="M168 200 Q 205 178 224 176"/>
    <path class="mech-arrow" d="M262 190 Q 290 210 300 220"/>
    <path class="mech-arrow" d="M350 214 Q 390 210 396 208"/>

    <!-- BARREL (mainspring) -->
    <g id="barrel">
      <circle class="rim" cx="118" cy="205" r="52"/>
      <circle class="disc" cx="118" cy="205" r="46"/>
      <path id="spring" class="spring" d=""/>
      <circle class="hub" cx="118" cy="205" r="9"/>
    </g>

    <!-- GEAR TRAIN -->
    <g id="gear1"><circle class="rim" cx="240" cy="176" r="34"/><circle class="disc" cx="240" cy="176" r="28"/><circle class="hub" cx="240" cy="176" r="7"/><line class="spoke" x1="212" y1="176" x2="268" y2="176"/><line class="spoke" x1="240" y1="148" x2="240" y2="204"/></g>
    <g id="gear2"><circle class="rim" cx="322" cy="224" r="28"/><circle class="disc" cx="322" cy="224" r="22"/><circle class="hub" cx="322" cy="224" r="6"/><line class="spoke" x1="300" y1="224" x2="344" y2="224"/><line class="spoke" x1="322" y1="202" x2="322" y2="246"/></g>

    <!-- COIL (stator) under the glide wheel -->
    <path id="coil" class="coil" d="M402 300 q 10 -18 20 0 q 10 18 20 0 q 10 -18 20 0 q 10 18 20 0 q 10 -18 20 0"/>

    <!-- GLIDE WHEEL (the star) -->
    <g id="glide">
      <circle class="glide-rim" cx="452" cy="205" r="60"/>
      <circle class="glide-face" cx="452" cy="205" r="54"/>
      <line class="spoke" x1="398" y1="205" x2="506" y2="205"/>
      <line class="spoke" x1="452" y1="151" x2="452" y2="259"/>
      <line class="spoke" x1="414" y1="167" x2="490" y2="243"/>
      <line class="spoke" x1="490" y1="167" x2="414" y2="243"/>
      <circle class="glide-mark" cx="452" cy="157" r="6"/>
      <circle class="hub" cx="452" cy="205" r="10"/>
      <circle class="hub-in" cx="452" cy="205" r="4"/>
    </g>

    <!-- QUARTZ + IC -->
    <g>
      <rect class="chip" x="612" y="150" width="72" height="46" rx="4"/>
      <rect class="chip-core" x="628" y="164" width="40" height="18" rx="3"/>
      <line class="chip-pin" x1="612" y1="160" x2="602" y2="160"/><line class="chip-pin" x1="612" y1="174" x2="602" y2="174"/><line class="chip-pin" x1="612" y1="188" x2="602" y2="188"/>
      <path class="xtal" d="M648 132 l 14 8 l -14 8 l -14 -8 z"/>
    </g>

    <!-- wires: generate (glide -> chip) and brake (chip -> coil) -->
    <path class="wire" d="M510 175 Q 580 150 612 168"/>
    <path class="flow" d="M510 175 Q 580 150 612 168"/>
    <path class="wire" d="M628 196 Q 560 250 466 292"/>
    <path class="flow" d="M628 196 Q 560 250 466 292"/>
    <!-- drive line to the seconds dial -->
    <path class="wire" d="M508 230 Q 580 270 616 300"/>

    <!-- SECONDS DIAL -->
    <g>
      <circle class="dialface" cx="662" cy="300" r="48"/>
      <g id="ticks"></g>
      <g id="hand"><rect class="hand" x="659.5" y="262" width="5" height="42" rx="2.5"/><rect class="hand-tip" x="659" y="262" width="6" height="12" rx="3"/></g>
      <circle class="cap" cx="662" cy="300" r="5"/>
    </g>
  </svg>

  <div class="controls">
    <div class="status" id="status"></div>
    <button class="btn" id="runBtn"></button>
    <button class="btn ghost" id="brakeBtn"></button>
    <button class="btn ghost" id="darkBtn"></button>
  </div>

  <div class="legend">
    <span><i class="swatch sw-mech"></i> <span id="legMech"></span></span>
    <span><i class="swatch sw-elec"></i> <span id="legElec"></span></span>
  </div>
  <p class="note" id="note"></p>
</div>

<script>
(function(){
  var NS="http://www.w3.org/2000/svg";

  /* ---------- kétnyelvűség: /widgets/spring-drive.html?lang=en ---------- */
  var LANG = (new URLSearchParams(location.search).get('lang') === 'en') ? 'en' : 'hu';
  var T = {
    hu: {
      title:'A Spring Drive működés közben',
      sub:'A rugó a fogaskeréksoron át pörgeti a siklókereket, ami a tekercs fölött áramot termel. Ez táplálja a kvarcot és az IC-t, az pedig egy csendes elektromágneses fékkel tartja pontosan a sebességet, amitől a mutató siklik. A <b>Fék</b> gombbal kikapcsolhatod a szabályozást: nélküle a rugó ereje elszalad.',
      aria:'A Grand Seiko Spring Drive sematikus, mozgó modellje',
      barrel:'Rugó (barrel)', train:'Fogaskeréksor', glide:'Siklókerék',
      coil:'Tekercs', chip:'Kvarc + IC', hand:'Mutató (siklik)',
      run:'Start / Stop', brakeOn:'Fék (Tri-Synchro): be', brakeOff:'Fék (Tri-Synchro): ki',
      lightsOff:'Lámpa le', lightsOn:'Lámpa fel',
      stopped:'Áll', regulated:'Szabályozva · a mutató siklik', runaway:'Szabályozás nélkül: elszalad',
      legMech:'Mechanikus energia (rugó, kerekek)',
      legElec:'Elektromos / elektromágneses (szabályozás)',
      note:'Sematikus, működési modell: a viselkedés és az elv pontos, nem egy konkrét kaliber mérnöki rajza. Valójában a siklókerék másodpercenként nyolcszor fordul; itt lassítva látszik.'
    },
    en: {
      title:'Spring Drive at work',
      sub:'The mainspring turns the glide wheel through the gear train, and the wheel generates a current over the coil. That feeds the quartz and the IC, which hold the speed exactly with a silent electromagnetic brake — and that is what makes the hand glide. The <b>Brake</b> button switches the regulation off: without it, the mainspring runs away.',
      aria:'Schematic animated model of the Grand Seiko Spring Drive',
      barrel:'Mainspring (barrel)', train:'Gear train', glide:'Glide wheel',
      coil:'Coil', chip:'Quartz + IC', hand:'Hand (glides)',
      run:'Start / Stop', brakeOn:'Brake (Tri-Synchro): on', brakeOff:'Brake (Tri-Synchro): off',
      lightsOff:'Lights off', lightsOn:'Lights on',
      stopped:'Stopped', regulated:'Regulated · the hand glides', runaway:'Unregulated: it runs away',
      legMech:'Mechanical energy (mainspring, wheels)',
      legElec:'Electrical / electromagnetic (regulation)',
      note:'A schematic working model: the behaviour and the principle are accurate, but this is not an engineering drawing of any one calibre. In reality the glide wheel turns eight times a second; here it is slowed down.'
    }
  }[LANG];

  document.documentElement.lang = LANG;
  document.title = T.title;
  document.getElementById('title').textContent = T.title;
  document.getElementById('sub').innerHTML = T.sub;
  document.getElementById('rig').setAttribute('aria-label', T.aria);
  document.getElementById('lblBarrel').textContent = T.barrel;
  document.getElementById('lblTrain').textContent = T.train;
  document.getElementById('lblGlide').textContent = T.glide;
  document.getElementById('lblCoil').textContent = T.coil;
  document.getElementById('lblChip').textContent = T.chip;
  document.getElementById('lblHand').textContent = T.hand;
  document.getElementById('runBtn').textContent = T.run;
  document.getElementById('darkBtn').textContent = T.lightsOff;
  document.getElementById('legMech').textContent = T.legMech;
  document.getElementById('legElec').textContent = T.legElec;
  document.getElementById('note').textContent = T.note;

  // mainspring spiral inside the barrel
  var sp=[], th=0, bx=118, by=205;
  while(th < 5.2*2*Math.PI){ var r=6+1.15*th; sp.push((bx+r*Math.cos(th)).toFixed(1)+' '+(by+r*Math.sin(th)).toFixed(1)); th+=0.25; }
  document.getElementById('spring').setAttribute('d','M '+sp.join(' L '));
  // seconds dial ticks
  var tg=document.getElementById('ticks');
  for(var k=0;k<60;k++){ var big=(k%5===0); var ln=document.createElementNS(NS,'line');
    ln.setAttribute('class','tick'); ln.setAttribute('x1',662); ln.setAttribute('y1',big?256:259);
    ln.setAttribute('x2',662); ln.setAttribute('y2',big?263:261); ln.setAttribute('stroke-width',big?1.4:0.7);
    ln.setAttribute('transform','rotate('+(k*6)+' 662 300)'); tg.appendChild(ln); }

  var rig=document.getElementById('rig');
  var barrel=document.getElementById('barrel'), gear1=document.getElementById('gear1'),
      gear2=document.getElementById('gear2'), glide=document.getElementById('glide'), hand=document.getElementById('hand');
  var statusEl=document.getElementById('status');
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var running=false, braked=true;
  var glideAngle=0, handAngle=0, speed=0, lastT=null;
  var NOM=210;               // nominal glide-wheel speed (deg/sec)

  function frame(now){
    var dt = lastT!=null ? (now-lastT)/1000 : 0; lastT=now;
    if(!running){ speed += (0-speed)*0.1; }
    else if(braked){ speed += (NOM-speed)*0.08; }
    else { speed += (NOM*3.2-speed)*0.02; }   // unregulated: mainspring torque runs away
    glideAngle += speed*dt;
    var handRate = !running ? 0 : (braked ? 20 : speed*0.28);
    handAngle = (handAngle + handRate*dt) % 360;

    barrel.setAttribute('transform','rotate('+(-glideAngle*0.14).toFixed(2)+' 118 205)');
    gear1.setAttribute('transform','rotate('+(glideAngle*0.42).toFixed(2)+' 240 176)');
    gear2.setAttribute('transform','rotate('+(-glideAngle*0.62).toFixed(2)+' 322 224)');
    glide.setAttribute('transform','rotate('+glideAngle.toFixed(2)+' 452 205)');
    hand.setAttribute('transform','rotate('+handAngle.toFixed(2)+' 662 300)');

    rig.classList.toggle('is-reg', running && braked);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  function updateStatus(){
    statusEl.className='status';
    if(!running){ statusEl.textContent=T.stopped; }
    else if(braked){ statusEl.textContent=T.regulated; statusEl.classList.add('ok'); }
    else { statusEl.textContent=T.runaway; statusEl.classList.add('warn'); }
  }
  var brakeBtn=document.getElementById('brakeBtn');
  brakeBtn.textContent = T.brakeOn;

  document.getElementById('runBtn').addEventListener('click', function(){ running=!running; if(running) lastT=null; updateStatus(); });
  brakeBtn.addEventListener('click', function(){
    braked=!braked; brakeBtn.textContent = braked ? T.brakeOn : T.brakeOff; updateStatus();
  });

  var darkBtn=document.getElementById('darkBtn');
  function setDark(on){
    document.body.classList.toggle('dark', on);
    darkBtn.textContent = on ? T.lightsOn : T.lightsOff;
  }
  darkBtn.addEventListener('click', function(){ setDark(!document.body.classList.contains('dark')); });
  updateStatus();

  /* ---------- beágyazva: a napló vezérel ---------- */
  var embedded = window.parent !== window;
  if(embedded){
    document.body.classList.add('embedded');

    window.addEventListener('message', function(e){
      if(e.source !== window.parent) return;
      if(!e.data || e.data.type !== 'lume:lights') return;
      setDark(!!e.data.dark);
    });

    var lastH = 0;
    function reportHeight(){
      var h = Math.ceil(document.querySelector('.card').getBoundingClientRect().height) + 2;
      if(h !== lastH){ lastH = h; window.parent.postMessage({ type:'lume:height', height:h }, '*'); }
    }
    new ResizeObserver(reportHeight).observe(document.querySelector('.card'));
    window.addEventListener('load', reportHeight);
    reportHeight();

    window.parent.postMessage({ type:'lume:ready' }, '*');
  }
})();
</script>
</body>
</html>
