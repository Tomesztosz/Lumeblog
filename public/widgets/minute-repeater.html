<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Percütő modell</title>
<link href="/widgets/fonts.css" rel="stylesheet">
<style>
:root{--paper:#E6DAC1;--card:#EFE6D2;--panel:#F5ECD8;--ink:#2A231D;--soft:#746858;--line:rgba(42,35,29,.16);--line2:rgba(42,35,29,.07);--brass:#8F6E31;--gold:#BA984F;--lume:#82964F;--steel:#77736C;--steel-light:#C6C0B5;--shadow:rgba(42,35,29,.13)}
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;padding:12px;background:var(--paper);color:var(--ink);font-family:'Hanken Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased;transition:.25s background,.25s color}
.card{width:100%;max-width:900px;margin:auto;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:22px;overflow:hidden}
h1{font:600 25px/1.08 'Fraunces',Georgia,serif;letter-spacing:-.015em;margin:0 0 5px}.intro{max-width:70ch;margin:0 0 17px;color:var(--soft);font-size:14px;line-height:1.45}
.machine{position:relative;min-height:394px;border:1px solid var(--line);border-radius:5px;background:radial-gradient(circle at 47% 48%,var(--panel),color-mix(in srgb,var(--card) 87%,var(--paper)));overflow:hidden}
.machine-head{position:absolute;top:13px;left:15px;right:15px;display:flex;align-items:center;justify-content:space-between;gap:12px;z-index:12}.eyebrow{font:500 9px 'IBM Plex Mono',monospace;letter-spacing:.11em;text-transform:uppercase;color:var(--soft)}.key{display:flex;gap:13px;color:var(--soft);font-size:10px}.key span{display:flex;align-items:center;gap:5px}.swatch{width:9px;height:9px;border-radius:50%;display:inline-block}.swatch.low{background:var(--brass)}.swatch.high{background:var(--lume)}
.slide{position:absolute;left:17px;top:67px;width:42px;bottom:49px;z-index:10}.slide-name{position:absolute;left:-13px;top:113px;width:112px;transform:rotate(-90deg);font:500 8px 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);text-align:center}.slide-track{position:absolute;left:8px;top:0;width:27px;height:220px;border:1px solid var(--line);border-radius:15px;background:var(--line2)}.slide-track:before{content:"";position:absolute;left:50%;top:21px;bottom:21px;border-left:1px dashed var(--brass)}.slide-knob{position:absolute;left:3px;top:3px;width:19px;height:59px;border:1px solid var(--brass);border-radius:11px;background:linear-gradient(90deg,var(--gold),color-mix(in srgb,var(--gold) 42%,var(--panel)),var(--brass));box-shadow:0 3px 7px var(--shadow);transition:transform .5s cubic-bezier(.25,.75,.2,1)}.machine.armed .slide-knob{transform:translateY(154px)}
.movement{position:absolute;left:54%;top:52px;width:338px;height:315px;transform:translateX(-50%)}.plate{position:absolute;inset:8px 20px 9px;border:1px solid var(--line);border-radius:50%;background:color-mix(in srgb,var(--panel) 76%,transparent);box-shadow:inset 0 0 35px var(--line2),0 9px 22px var(--shadow)}
.gong{position:absolute;border-radius:50%;transition:.12s filter,.12s transform,.12s border-width}.gong.low{inset:24px 38px 26px;border:5px solid var(--brass)}.gong.high{inset:37px 51px 39px;border:4px solid var(--lume)}.gong.low.ring{filter:drop-shadow(0 0 9px var(--brass));transform:scale(1.012);border-width:7px}.gong.high.ring{filter:drop-shadow(0 0 10px var(--lume));transform:scale(.985);border-width:6px}
.gong-anchor{position:absolute;width:17px;height:22px;left:48px;top:143px;border:1px solid var(--line);border-radius:3px;background:var(--steel);box-shadow:inset 0 0 0 3px var(--steel-light);z-index:4}
.hub{position:absolute;left:50%;top:51%;width:56px;height:56px;margin:-28px;border:1px solid var(--line);border-radius:50%;background:var(--card);box-shadow:0 3px 9px var(--shadow);z-index:3}.hub:before,.hub:after{content:"";position:absolute;border-radius:50%;border:1px solid var(--line)}.hub:before{inset:8px}.hub:after{inset:20px;background:var(--brass)}
.hammer{position:absolute;width:92px;height:15px;border:1px solid color-mix(in srgb,var(--steel) 78%,var(--ink));border-radius:8px;background:linear-gradient(180deg,var(--steel-light),var(--steel));transform-origin:9px 50%;z-index:7;transition:transform .08s ease,filter .12s}.hammer:before{content:"";position:absolute;left:-5px;top:2px;width:10px;height:10px;border-radius:50%;background:var(--brass);border:1px solid var(--panel)}.hammer:after{content:"";position:absolute;right:-10px;top:-8px;width:27px;height:29px;border-radius:44% 56% 48% 42%;background:linear-gradient(145deg,#D6D0C5,var(--steel));border:1px solid color-mix(in srgb,var(--steel) 78%,var(--ink));box-shadow:0 2px 4px var(--shadow)}.hammer.low{left:80px;bottom:56px;transform:rotate(-28deg)}.hammer.high{right:80px;bottom:56px;transform:rotate(208deg)}.hammer.low.hit{transform:rotate(-38deg);filter:drop-shadow(0 0 6px var(--brass))}.hammer.high.hit{transform:rotate(218deg);filter:drop-shadow(0 0 6px var(--lume))}
.part-label{position:absolute;z-index:9;padding:5px 7px;border-radius:3px;background:var(--panel);border:1px solid var(--line);font:500 8px/1.2 'IBM Plex Mono',monospace;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;color:var(--ink);box-shadow:0 2px 5px var(--shadow)}.label-low-gong{right:-76px;top:83px;border-left:3px solid var(--brass)}.label-high-gong{right:-83px;top:127px;border-left:3px solid var(--lume)}.label-low-hammer{left:-72px;bottom:7px;border-left:3px solid var(--brass)}.label-high-hammer{right:-73px;bottom:7px;border-left:3px solid var(--lume)}
.explain{position:absolute;left:74px;right:15px;bottom:13px;display:flex;justify-content:center;gap:22px;font-size:10px;color:var(--soft)}.explain span{display:flex;align-items:center;gap:6px}.explain b{font:600 9px 'IBM Plex Mono',monospace;color:var(--ink);letter-spacing:.05em}
.readout{margin-top:12px;display:grid;grid-template-columns:184px minmax(0,1fr);gap:10px}.time-box{border:1px solid var(--line);border-radius:5px;background:var(--panel);padding:12px}.time{display:block;font:600 37px/1 'Fraunces',Georgia,serif;font-variant-numeric:tabular-nums}.total{display:block;margin-top:8px;font:9px 'IBM Plex Mono',monospace;letter-spacing:.07em;text-transform:uppercase;color:var(--soft)}.timeline{height:5px;margin-top:11px;border-radius:99px;background:var(--line2);overflow:hidden}.timeline span{display:block;width:0;height:100%;background:linear-gradient(90deg,var(--brass),var(--lume));transition:width .15s linear}
.sequence{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.code-row{border:1px solid var(--line);border-radius:4px;padding:9px 10px;background:color-mix(in srgb,var(--panel) 75%,transparent);min-height:92px}.code-top{display:flex;align-items:center;justify-content:space-between;gap:8px}.code-name{font:600 9px 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase}.count{font:600 18px 'Fraunces',Georgia,serif;color:var(--brass)}.code-sub{display:block;margin-top:2px;font-size:10.5px;color:var(--soft);min-height:15px}.notes{display:flex;align-items:center;gap:4px;margin-top:9px;min-height:12px;overflow:hidden}.note{width:8px;height:8px;border-radius:50%;background:var(--line);flex:0 0 auto}.note.low{background:var(--brass)}.note.high{background:var(--lume)}.note.pair{width:17px;border-radius:8px;background:linear-gradient(90deg,var(--lume) 0 46%,transparent 46% 54%,var(--brass) 54%)}.note.active{box-shadow:0 0 0 3px color-mix(in srgb,var(--lume) 28%,transparent),0 0 9px var(--lume);transform:scale(1.25)}
.status{margin-top:10px;border-left:3px solid var(--brass);padding:7px 10px;background:var(--line2);font-size:11.5px;line-height:1.3;color:var(--soft);min-height:48px}.status b{display:block;color:var(--ink);margin-bottom:2px}
.controls{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:end;margin-top:12px}.setter-label{display:block;margin-bottom:6px;font:9px 'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.07em;color:var(--soft)}.set-buttons,.action-buttons{display:flex;gap:6px;flex-wrap:wrap}.action-buttons{justify-content:flex-end}button{min-height:36px;font:600 11.5px 'Hanken Grotesk',sans-serif;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:3px;padding:8px 11px;cursor:pointer}button:hover{border-color:var(--brass);color:var(--brass)}button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}button.primary{min-width:126px;background:var(--ink);border-color:var(--ink);color:var(--card)}button.primary:hover{background:var(--brass);border-color:var(--brass);color:white}.preset{color:var(--brass)}.secondary{color:var(--soft)}
.foot{margin:12px 0 0;padding-top:9px;border-top:1px solid var(--line2);font-size:11.5px;line-height:1.35;color:var(--soft)}
body.dark{--paper:#13100B;--card:#1B1610;--panel:#231D15;--ink:#B9AE98;--soft:#837967;--line:rgba(199,186,160,.18);--line2:rgba(199,186,160,.07);--brass:#A48648;--gold:#8E743F;--lume:#B7D77D;--steel:#696258;--steel-light:#A69E91;--shadow:rgba(0,0,0,.32)}
@media(max-width:720px){body{padding:7px}.card{padding:15px 12px}h1{font-size:21px;overflow-wrap:anywhere}.intro{font-size:12.5px}.key{display:none}.machine{min-height:365px}.movement{left:52%;top:51px;width:294px;height:278px}.label-low-gong{right:-39px;top:76px}.label-high-gong{right:-43px;top:116px}.label-low-hammer{left:-35px}.label-high-hammer{right:-35px}.part-label{font-size:7px}.hammer{width:79px}.hammer.low{left:69px;bottom:49px}.hammer.high{right:69px;bottom:49px}.explain{left:57px;gap:10px}.readout{grid-template-columns:1fr}.sequence{grid-template-columns:repeat(3,minmax(0,1fr))}.controls{grid-template-columns:1fr}.action-buttons{justify-content:flex-start}}
@media(max-width:560px){h1{font-size:19px}.machine{min-height:355px}.movement{left:54%;top:57px;width:270px;height:254px}.label-low-gong{right:1px;top:50px}.label-high-gong{right:1px;top:84px}.label-low-hammer{left:8px;bottom:-3px}.label-high-hammer{right:8px;bottom:-3px}.explain{left:48px;right:7px;bottom:9px;gap:8px}.explain b{font-size:7.5px}.sequence{grid-template-columns:1fr}.code-row{min-height:78px}}
@media(max-width:450px){.machine{min-height:350px}.machine-head{left:10px}.slide{left:8px}.movement{left:54%;top:59px;width:256px;height:244px}.plate{inset:8px 17px}.gong.low{inset:23px 31px}.gong.high{inset:35px 43px}.gong-anchor{left:39px;top:110px}.hub{width:46px;height:46px;margin:-23px}.hammer{width:68px;height:13px}.hammer:after{width:23px;height:25px;top:-7px}.hammer.low{left:59px;bottom:42px}.hammer.high{right:59px;bottom:42px}.label-low-gong{right:1px;top:45px}.label-high-gong{right:1px;top:75px}.label-low-hammer{left:8px;bottom:-4px}.label-high-hammer{right:8px;bottom:-4px}.part-label{padding:4px;font-size:6.5px;letter-spacing:.04em}.explain{left:44px;right:6px;bottom:9px;gap:7px;font-size:8px}.explain b{font-size:7px}.sequence{grid-template-columns:1fr}.code-row{min-height:78px}.controls button{padding:7px 9px}.action-buttons button.primary{flex:1}}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>
<body>
<main class="card">
  <h1 id="title"></h1>
  <p class="intro" id="intro"></p>
  <section class="machine" id="machine">
    <div class="machine-head"><span class="eyebrow" id="viewLabel"></span><div class="key"><span><i class="swatch low"></i><b id="lowKey"></b></span><span><i class="swatch high"></i><b id="highKey"></b></span></div></div>
    <div class="slide" aria-hidden="true"><span class="slide-name" id="slideLabel"></span><div class="slide-track"><div class="slide-knob"></div></div></div>
    <div class="movement">
      <div class="plate"></div>
      <div class="gong low" id="lowGong"></div><div class="gong high" id="highGong"></div><div class="gong-anchor"></div><div class="hub"></div>
      <div class="hammer low" id="lowHammer"></div><div class="hammer high" id="highHammer"></div>
      <span class="part-label label-low-gong" id="lowGongLabel"></span><span class="part-label label-high-gong" id="highGongLabel"></span>
      <span class="part-label label-low-hammer" id="lowHammerLabel"></span><span class="part-label label-high-hammer" id="highHammerLabel"></span>
    </div>
    <div class="explain"><span><i class="swatch low"></i><b id="lowMeaning"></b></span><span><i class="swatch high"></i><b id="highMeaning"></b></span></div>
  </section>
  <section class="readout">
    <div class="time-box"><span class="time" id="time">10:37</span><span class="total" id="total"></span><div class="timeline"><span id="progress"></span></div></div>
    <div class="sequence">
      <div class="code-row"><div class="code-top"><span class="code-name" id="hoursLabel"></span><b class="count" id="hoursCount"></b></div><span class="code-sub" id="hoursSub"></span><div class="notes" id="hoursNotes"></div></div>
      <div class="code-row"><div class="code-top"><span class="code-name" id="quartersLabel"></span><b class="count" id="quartersCount"></b></div><span class="code-sub" id="quartersSub"></span><div class="notes" id="quartersNotes"></div></div>
      <div class="code-row"><div class="code-top"><span class="code-name" id="minutesLabel"></span><b class="count" id="minutesCount"></b></div><span class="code-sub" id="minutesSub"></span><div class="notes" id="minutesNotes"></div></div>
    </div>
  </section>
  <div class="status"><b id="statusTitle"></b><span id="statusText"></span></div>
  <div class="controls">
    <div><span class="setter-label" id="setLabel"></span><div class="set-buttons"><button id="hourMinus">− 1 h</button><button id="hourPlus">+ 1 h</button><button id="minuteMinus">− 1 min</button><button id="minutePlus">+ 1 min</button><button class="preset" id="presetOne">10:37</button><button class="preset" id="presetTwo">12:59</button></div></div>
    <div class="action-buttons"><button class="primary" id="playBtn"></button><button class="secondary" id="stopBtn"></button><button class="secondary" id="nowBtn"></button></div>
  </div>
  <p class="foot" id="foot"></p>
</main>
<script src="/widgets/frame-bridge.js"></script>
<script>
(function(){
  var q=new URLSearchParams(location.search),lang=q.get('lang')==='en'?'en':'hu';
  var D={
    hu:{title:'Hallgasd meg, hogyan mondja ki az időt',intro:'Két kalapács két különböző hangú gongot üt meg. A modell közben megmutatja, melyik alkatrész szól, és mit jelent a hangja.',view:'A percütő hangadó része',lowKey:'mély hang',highKey:'magas hang',slide:'indító csúszka',lowGong:'Mély gong',highGong:'Magas gong',lowHammer:'Mély kalapács',highHammer:'Magas kalapács',lowMeaning:'MÉLY: óra és negyed',highMeaning:'MAGAS: negyed és perc',hours:'ÓRÁK',hoursSub:'egy mély ütés óránként',quarters:'NEGYEDÓRÁK',quartersSub:'egy magas és mély hangpár',minutes:'PERCEK',minutesSub:'egy magas ütés percenként',total:'kalapácsütés',ready:'A szerkezet készen áll',readyText:'Indítsd el. Először a mély kalapács üti az órákat, utána a két kalapács a negyedeket, végül a magas kalapács a perceket.',armed:'Az indító csúszka felhúzza az ütőművet',armedText:'A percütő most leolvassa, hány órát, negyedet és percet kell megszólaltatnia.',striking:'Most ezt hallod',done:'Az idő teljesen elhangzott',doneText:'A kalapácsok megálltak. Válassz másik időpontot, és figyeld meg, hogyan változik a hangok sorrendje.',set:'IDŐ BEÁLLÍTÁSA',play:'Üsd el az időt',stop:'Megállítás',now:'Mostani idő',foot:'Sematikus működési modell valódi hanggal. A rajz nem egy konkrét kalibert másol. A klasszikus, kétgongos percütő hangkódját mutatja.'},
    en:{title:'Hear how a watch speaks the time',intro:'Two hammers strike two gongs with different notes. As it plays, the model shows which part sounds and what its note means.',view:'Sounding parts of a minute repeater',lowKey:'low note',highKey:'high note',slide:'starting slide',lowGong:'Low gong',highGong:'High gong',lowHammer:'Low hammer',highHammer:'High hammer',lowMeaning:'LOW: hour and quarter',highMeaning:'HIGH: quarter and minute',hours:'HOURS',hoursSub:'one low strike per hour',quarters:'QUARTERS',quartersSub:'one high and low pair',minutes:'MINUTES',minutesSub:'one high strike per minute',total:'hammer strikes',ready:'The mechanism is ready',readyText:'Start it. The low hammer first strikes the hours, both hammers then sound the quarters, and the high hammer finishes with the minutes.',armed:'The slide winds the striking mechanism',armedText:'The repeater now reads how many hours, quarters and minutes it must sound.',striking:'You are now hearing',done:'The full time has sounded',doneText:'The hammers have stopped. Choose another time and notice how the order of notes changes.',set:'SET THE TIME',play:'Strike the time',stop:'Stop',now:'Current time',foot:'Schematic functional model with audible notes. It does not copy a specific calibre. It shows the classic sound code of a two-gong minute repeater.'}
  }[lang];
  document.documentElement.lang=lang;
  var ids={title:'title',intro:'intro',viewLabel:'view',lowKey:'lowKey',highKey:'highKey',slideLabel:'slide',lowGongLabel:'lowGong',highGongLabel:'highGong',lowHammerLabel:'lowHammer',highHammerLabel:'highHammer',lowMeaning:'lowMeaning',highMeaning:'highMeaning',hoursLabel:'hours',hoursSub:'hoursSub',quartersLabel:'quarters',quartersSub:'quartersSub',minutesLabel:'minutes',minutesSub:'minutesSub',setLabel:'set',playBtn:'play',stopBtn:'stop',nowBtn:'now',foot:'foot'};
  Object.keys(ids).forEach(function(id){document.getElementById(id).textContent=D[ids[id]]});
  var machine=document.getElementById('machine'),timeEl=document.getElementById('time'),totalEl=document.getElementById('total'),progress=document.getElementById('progress'),lowHammer=document.getElementById('lowHammer'),highHammer=document.getElementById('highHammer'),lowGong=document.getElementById('lowGong'),highGong=document.getElementById('highGong'),statusTitle=document.getElementById('statusTitle'),statusText=document.getElementById('statusText'),playBtn=document.getElementById('playBtn');
  var value=10*60+37,timers=[],audio=null,running=false;
  function pad(n){return String(n).padStart(2,'0')}
  function parts(){var h=Math.floor(value/60)%12||12,m=value%60,q=Math.floor(m/15),r=m%15;return{h:h,m:m,q:q,r:r,total:h+q*2+r}}
  function notes(container,count,type){container.innerHTML='';for(var i=0;i<count;i++){var n=document.createElement('i');n.className='note '+type;n.dataset.index=i;container.appendChild(n)}}
  function render(){var p=parts(),clockHour=Math.floor(value/60)%12;timeEl.textContent=pad(clockHour||12)+':'+pad(p.m);document.getElementById('hoursCount').textContent=p.h;document.getElementById('quartersCount').textContent=p.q;document.getElementById('minutesCount').textContent=p.r;notes(document.getElementById('hoursNotes'),p.h,'low');notes(document.getElementById('quartersNotes'),p.q,'pair');notes(document.getElementById('minutesNotes'),p.r,'high');totalEl.textContent=p.total+' '+D.total;progress.style.width='0';setStatus('ready')}
  function setStatus(key,text){statusTitle.textContent=D[key];statusText.textContent=text||D[key+'Text']||''}
  function clear(){timers.forEach(clearTimeout);timers=[];running=false;machine.classList.remove('armed');lowHammer.classList.remove('hit');highHammer.classList.remove('hit');lowGong.classList.remove('ring');highGong.classList.remove('ring');document.querySelectorAll('.note.active').forEach(function(n){n.classList.remove('active')});progress.style.width='0'}
  function tone(kind){if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();var now=audio.currentTime,osc=audio.createOscillator(),gain=audio.createGain(),filter=audio.createBiquadFilter();osc.type='sine';osc.frequency.value=kind==='low'?392:659.25;filter.type='lowpass';filter.frequency.value=kind==='low'?1200:1900;gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(kind==='low'?.20:.14,now+.008);gain.gain.exponentialRampToValueAtTime(.0001,now+.72);osc.connect(filter);filter.connect(gain);gain.connect(audio.destination);osc.start(now);osc.stop(now+.75)}
  function flash(kind,selector,index){var hammer=kind==='low'?lowHammer:highHammer,gong=kind==='low'?lowGong:highGong;hammer.classList.add('hit');gong.classList.add('ring');tone(kind);var n=document.querySelector(selector+' .note[data-index="'+index+'"]');if(n)n.classList.add('active');timers.push(setTimeout(function(){hammer.classList.remove('hit');gong.classList.remove('ring');if(n)n.classList.remove('active')},150))}
