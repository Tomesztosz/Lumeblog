<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Percütő modell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Hanken+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#E6DAC1;--card:#EFE6D2;--panel:#F5ECD8;--ink:#2A231D;--soft:#746858;--line:rgba(42,35,29,.17);--line2:rgba(42,35,29,.08);--brass:#8F6E31;--gold:#BA984F;--lume:#8FA35F;--red:#B6574D;--steel:#8D887F;--shadow:rgba(42,35,29,.14)}
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;padding:14px;background:var(--paper);color:var(--ink);font-family:'Hanken Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased;transition:.25s background,.25s color}
.card{width:100%;max-width:860px;min-width:0;margin:auto;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:22px;overflow:hidden}
h1{font:600 25px/1.08 'Fraunces',Georgia,serif;letter-spacing:-.015em;margin:0 0 5px}.intro{max-width:75ch;margin:0 0 14px;color:var(--soft);font-size:14px;line-height:1.42}
.stage{display:grid;grid-template-columns:minmax(360px,1.12fr) minmax(250px,.88fr);gap:14px;min-width:0;min-height:460px}
.machine{position:relative;width:100%;min-width:0;min-height:460px;border:1px solid var(--line);border-radius:5px;background:radial-gradient(circle at 49% 46%,var(--panel),color-mix(in srgb,var(--card) 86%,var(--paper)));overflow:hidden}
.view-label{position:absolute;top:10px;left:12px;font:500 8.5px 'IBM Plex Mono',monospace;letter-spacing:.11em;text-transform:uppercase;color:var(--soft);z-index:8}
.slide-track{position:absolute;left:10px;top:76px;width:30px;height:288px;border:1px solid var(--line);border-radius:16px;background:var(--line2);z-index:9}.slide-track:before{content:"";position:absolute;left:50%;top:22px;bottom:22px;border-left:1px dashed var(--brass)}.slide-knob{position:absolute;left:3px;top:3px;width:22px;height:72px;border:1px solid var(--brass);border-radius:12px;background:linear-gradient(90deg,var(--gold),color-mix(in srgb,var(--gold) 45%,var(--panel)),var(--brass));box-shadow:0 3px 7px var(--shadow);transition:transform .5s cubic-bezier(.25,.75,.2,1)}.machine.armed .slide-knob{transform:translateY(208px)}
.watch{position:absolute;left:50%;top:42px;width:390px;height:390px;transform:translateX(-50%)}
.case{position:absolute;inset:7px;border-radius:50%;border:10px solid color-mix(in srgb,var(--steel) 68%,var(--ink));box-shadow:inset 0 0 0 4px var(--panel),0 10px 22px var(--shadow);background:var(--panel)}
.gong{position:absolute;border-radius:50%;border:4px solid var(--brass);inset:30px;box-shadow:0 0 0 1px color-mix(in srgb,var(--gold) 55%,transparent);transition:.12s filter,.12s transform}.gong.high{inset:39px;border-color:color-mix(in srgb,var(--gold) 72%,white)}.gong.low.ring{filter:drop-shadow(0 0 8px var(--brass));transform:scale(1.012)}.gong.high.ring{filter:drop-shadow(0 0 9px var(--lume));transform:scale(.988)}
.dial{position:absolute;inset:63px;border:1px solid var(--line);border-radius:50%;background:radial-gradient(circle,var(--card) 0 45%,color-mix(in srgb,var(--panel) 84%,var(--paper)) 72%);box-shadow:inset 0 0 18px var(--line2)}
.markers{position:absolute;inset:8px;border-radius:50%;background:repeating-conic-gradient(from -1deg,var(--soft) 0 1deg,transparent 1deg 30deg);mask:radial-gradient(circle,transparent 0 86%,#000 87%)}
.brand{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);font:600 12px 'Fraunces',serif;letter-spacing:.2em;color:var(--soft)}
.hand{position:absolute;left:50%;bottom:50%;transform-origin:50% 100%;border-radius:99px;z-index:3}.hour-hand{width:7px;height:64px;margin-left:-3.5px;background:var(--ink)}.minute-hand{width:4px;height:91px;margin-left:-2px;background:var(--brass)}.pin{position:absolute;left:50%;top:50%;width:17px;height:17px;margin:-8.5px;border:4px solid var(--panel);border-radius:50%;background:var(--brass);z-index:5}
.hammer{position:absolute;width:77px;height:13px;background:linear-gradient(180deg,#B9B4AA,#736E66);border:1px solid #625E57;border-radius:9px;transform-origin:10px 50%;z-index:6;transition:transform .08s ease}.hammer:after{content:"";position:absolute;right:-7px;top:-6px;width:22px;height:24px;border-radius:45% 55% 50% 40%;background:linear-gradient(145deg,#D0CAC0,#777168);border:1px solid #5F5A53}.hammer.low{left:73px;bottom:67px;transform:rotate(-25deg)}.hammer.high{right:73px;bottom:67px;transform:rotate(205deg)}.hammer.low.hit{transform:rotate(-34deg)}.hammer.high.hit{transform:rotate(214deg)}
.caption{position:absolute;left:52px;right:10px;bottom:11px;text-align:center;font:9px 'IBM Plex Mono',monospace;letter-spacing:.08em;color:var(--soft)}
.readout{display:flex;flex-direction:column;gap:9px;min-width:0;max-width:100%}.time-box{min-width:0;border:1px solid var(--line);border-radius:5px;background:var(--panel);padding:11px 12px}.time-head{display:flex;min-width:0;align-items:flex-end;justify-content:space-between;gap:10px}.time{font:600 36px/1 'Fraunces',Georgia,serif;font-variant-numeric:tabular-nums}.total{max-width:130px;font:9px 'IBM Plex Mono',monospace;letter-spacing:.07em;text-transform:uppercase;color:var(--soft);text-align:right;min-height:24px}.timeline{height:6px;margin-top:10px;border-radius:99px;background:var(--line2);overflow:hidden}.timeline span{display:block;width:0;height:100%;background:linear-gradient(90deg,var(--brass),var(--lume));transition:width .15s linear}
.code{display:grid;gap:7px}.code-row{border:1px solid var(--line);border-radius:4px;padding:9px 10px;background:color-mix(in srgb,var(--panel) 75%,transparent);min-height:82px}.code-top{display:flex;align-items:center;justify-content:space-between;gap:8px}.code-name{font:600 9px 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase}.count{font:600 17px 'Fraunces',Georgia,serif;color:var(--brass)}.code-sub{display:block;margin-top:2px;font-size:10.5px;color:var(--soft);min-height:15px}.notes{display:flex;align-items:center;gap:4px;margin-top:7px;min-height:12px;overflow:hidden}.note{width:8px;height:8px;border-radius:50%;background:var(--line);flex:0 0 auto}.note.low{background:var(--brass)}.note.high{background:var(--lume)}.note.pair{width:17px;border-radius:8px;background:linear-gradient(90deg,var(--lume) 0 46%,transparent 46% 54%,var(--brass) 54%)}.note.active{box-shadow:0 0 0 3px color-mix(in srgb,var(--lume) 28%,transparent),0 0 9px var(--lume);transform:scale(1.25)}
.status{border-left:3px solid var(--brass);padding:7px 9px;background:var(--line2);font-size:11.5px;line-height:1.3;color:var(--soft);min-height:50px}.status b{display:block;color:var(--ink);margin-bottom:2px}
.controls{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:11px}.buttons{display:flex;gap:7px;flex-wrap:wrap}button{min-height:36px;font:600 11.5px 'Hanken Grotesk',sans-serif;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:3px;padding:8px 11px;cursor:pointer}button:hover{border-color:var(--brass);color:var(--brass)}button:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:2px}button.primary{min-width:116px;background:var(--ink);border-color:var(--ink);color:var(--card)}button.primary:hover{background:var(--brass);border-color:var(--brass);color:white}.theme{font:9px 'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.08em}.setter{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--line2)}.setter-label{font:9px 'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.07em;color:var(--soft);margin-right:3px}.setter button{min-width:46px}.preset{color:var(--brass)}
.foot{margin:11px 0 0;padding-top:9px;border-top:1px solid var(--line2);font-size:11.5px;line-height:1.35;color:var(--soft)}
body.dark{--paper:#13100B;--card:#1B1610;--panel:#231D15;--ink:#B9AE98;--soft:#837967;--line:rgba(199,186,160,.18);--line2:rgba(199,186,160,.07);--brass:#A48648;--gold:#8E743F;--lume:#B7D77D;--red:#D96A5E;--steel:#696258;--shadow:rgba(0,0,0,.32)}
@media(max-width:730px){body{padding:7px}.card{padding:15px 12px}h1{font-size:21px;overflow-wrap:anywhere}.intro{font-size:12.5px}.stage{grid-template-columns:minmax(0,1fr)}.machine{min-height:405px}.watch{top:34px;width:340px;height:340px}.caption{bottom:7px}.readout{display:grid;grid-template-columns:minmax(0,1fr)}.time-box{padding:9px 10px}.code{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.code-row:last-child{grid-column:1/-1}.controls{align-items:flex-start}.theme{margin-left:auto}}
@media(max-width:430px){.machine{min-height:370px}.watch{left:54%;width:292px;height:292px}.slide-track{top:67px;height:245px}.machine.armed .slide-knob{transform:translateY(165px)}.dial{inset:56px}.hour-hand{height:48px}.minute-hand{height:68px}.hammer{width:66px}.hammer.low{left:58px;bottom:53px}.hammer.high{right:58px;bottom:53px}.code{grid-template-columns:minmax(0,1fr)}.code-row:last-child{grid-column:auto}.setter{gap:5px}.setter button{min-width:41px;padding:7px 8px}}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>
<body>
<main class="card">
  <h1 id="title"></h1>
  <p class="intro" id="intro"></p>
  <section class="stage">
    <div class="machine" id="machine">
      <span class="view-label" id="viewLabel"></span>
      <div class="slide-track" aria-hidden="true"><div class="slide-knob"></div></div>
      <div class="watch">
        <div class="case"></div><div class="gong low" id="lowGong"></div><div class="gong high" id="highGong"></div>
        <div class="dial"><div class="markers"></div><span class="brand">LUME</span><div class="hand hour-hand" id="hourHand"></div><div class="hand minute-hand" id="minuteHand"></div><div class="pin"></div></div>
        <div class="hammer low" id="lowHammer"></div><div class="hammer high" id="highHammer"></div>
      </div>
      <span class="caption" id="machineCaption"></span>
    </div>
    <aside class="readout">
      <div class="time-box"><div class="time-head"><span class="time" id="time">10:37</span><span class="total" id="total"></span></div><div class="timeline"><span id="progress"></span></div></div>
      <div class="code">
        <div class="code-row"><div class="code-top"><span class="code-name" id="hoursLabel"></span><b class="count" id="hoursCount"></b></div><span class="code-sub" id="hoursSub"></span><div class="notes" id="hoursNotes"></div></div>
        <div class="code-row"><div class="code-top"><span class="code-name" id="quartersLabel"></span><b class="count" id="quartersCount"></b></div><span class="code-sub" id="quartersSub"></span><div class="notes" id="quartersNotes"></div></div>
        <div class="code-row"><div class="code-top"><span class="code-name" id="minutesLabel"></span><b class="count" id="minutesCount"></b></div><span class="code-sub" id="minutesSub"></span><div class="notes" id="minutesNotes"></div></div>
      </div>
      <div class="status"><b id="statusTitle"></b><span id="statusText"></span></div>
    </aside>
  </section>
  <div class="setter"><span class="setter-label" id="setLabel"></span><button id="hourMinus">− 1 h</button><button id="hourPlus">+ 1 h</button><button id="minuteMinus">− 1 min</button><button id="minutePlus">+ 1 min</button><button class="preset" id="presetOne">10:37</button><button class="preset" id="presetTwo">12:59</button></div>
  <div class="controls"><div class="buttons"><button class="primary" id="playBtn"></button><button id="stopBtn"></button><button id="nowBtn"></button></div><button class="theme" id="themeBtn"></button></div>
  <p class="foot" id="foot"></p>
</main>
<script>
(function(){
  var q=new URLSearchParams(location.search),lang=q.get('lang')==='en'?'en':'hu';
  var D={
    hu:{title:'Hallgasd meg, hogyan mondja ki az időt',intro:'A mély gong az órákat, a magas és mély hangpár a negyedeket, a magas gong pedig a maradék perceket számolja. Állíts be egy időpontot, majd indítsd el az ütést.',view:'A percütő számlap felől',caption:'Két kalapács, két gong, háromféle időjel',hours:'ÓRÁK',hoursSub:'mély hang',quarters:'NEGYEDÓRÁK',quartersSub:'magas és mély hangpár',minutes:'PERCEK',minutesSub:'magas hang',total:'kalapácsütés',ready:'A szerkezet készen áll',readyText:'A csúszka teljes útja felhúzza az ütőmű rugóját. A gomb ezt a mozdulatot indítja el.',armed:'A csúszka energiát ad',armedText:'Az ütőmű most leolvassa az óra, a negyed és a perc csigáját.',striking:'Az idő hangokra fordul',done:'A teljes idő elhangzott',doneText:'A kalapácsok megálltak. Válassz másik időpontot, és figyeld meg, hogyan változik a sorrend.',set:'IDŐ BEÁLLÍTÁSA',play:'Üsd el az időt',stop:'Megállítás',now:'Mostani idő',dark:'Lámpa le',light:'Lámpa fel',foot:'Sematikus működési modell valódi hanggal. A rajz nem egy konkrét kalibert másol, az órák, negyedek és percek klasszikus kétgongos kódját mutatja.'},
    en:{title:'Hear how a watch speaks the time',intro:'The low gong counts hours, a high and low pair counts quarters, and the high gong counts remaining minutes. Set a time, then start the strike.',view:'Minute repeater from the dial side',caption:'Two hammers, two gongs, three meanings',hours:'HOURS',hoursSub:'low note',quarters:'QUARTERS',quartersSub:'high and low pair',minutes:'MINUTES',minutesSub:'high note',total:'hammer strikes',ready:'The movement is ready',readyText:'The full travel of the slide winds the striking spring. The button starts that gesture here.',armed:'The slide supplies energy',armedText:'The mechanism now reads the hour, quarter and minute snails.',striking:'The time becomes sound',done:'The complete time has sounded',doneText:'The hammers have stopped. Choose another time and notice how the sequence changes.',set:'SET THE TIME',play:'Strike the time',stop:'Stop',now:'Current time',dark:'Lights off',light:'Lights on',foot:'Schematic functional model with audible notes. It does not copy a specific calibre, but shows the classic two-gong code for hours, quarters and minutes.'}
  }[lang];
  document.documentElement.lang=lang;
  var ids={title:'title',intro:'intro',viewLabel:'view',machineCaption:'caption',hoursLabel:'hours',hoursSub:'hoursSub',quartersLabel:'quarters',quartersSub:'quartersSub',minutesLabel:'minutes',minutesSub:'minutesSub',setLabel:'set',playBtn:'play',stopBtn:'stop',nowBtn:'now',foot:'foot'};
  Object.keys(ids).forEach(function(id){document.getElementById(id).textContent=D[ids[id]]});
  var machine=document.getElementById('machine'),timeEl=document.getElementById('time'),totalEl=document.getElementById('total'),progress=document.getElementById('progress'),hourHand=document.getElementById('hourHand'),minuteHand=document.getElementById('minuteHand'),lowHammer=document.getElementById('lowHammer'),highHammer=document.getElementById('highHammer'),lowGong=document.getElementById('lowGong'),highGong=document.getElementById('highGong'),statusTitle=document.getElementById('statusTitle'),statusText=document.getElementById('statusText'),playBtn=document.getElementById('playBtn'),themeBtn=document.getElementById('themeBtn');
  var value=10*60+37,timers=[],audio=null,running=false,currentNote=null;
  function pad(n){return String(n).padStart(2,'0')}
  function parts(){var h=Math.floor(value/60)%12||12,m=value%60,q=Math.floor(m/15),r=m%15;return{h:h,m:m,q:q,r:r,total:h+q*2+r}}
  function notes(container,count,type){container.innerHTML='';for(var i=0;i<count;i++){var n=document.createElement('i');n.className='note '+type;n.dataset.index=i;container.appendChild(n)}}
  function render(){var p=parts(),clockHour=Math.floor(value/60)%12;timeEl.textContent=pad(clockHour||12)+':'+pad(p.m);document.getElementById('hoursCount').textContent=p.h;document.getElementById('quartersCount').textContent=p.q;document.getElementById('minutesCount').textContent=p.r;notes(document.getElementById('hoursNotes'),p.h,'low');notes(document.getElementById('quartersNotes'),p.q,'pair');notes(document.getElementById('minutesNotes'),p.r,'high');totalEl.textContent=p.total+' '+D.total;hourHand.style.transform='rotate('+((clockHour%12)*30+p.m*.5)+'deg)';minuteHand.style.transform='rotate('+(p.m*6)+'deg)';progress.style.width='0';setStatus('ready')}
  function setStatus(key,text){statusTitle.textContent=D[key];statusText.textContent=text||D[key+'Text']||''}
  function themeLabel(){themeBtn.textContent=document.body.classList.contains('dark')?D.light:D.dark}
  function setDark(on){document.body.classList.toggle('dark',on);themeLabel()}
  function clear(){timers.forEach(clearTimeout);timers=[];running=false;machine.classList.remove('armed');lowHammer.classList.remove('hit');highHammer.classList.remove('hit');lowGong.classList.remove('ring');highGong.classList.remove('ring');document.querySelectorAll('.note.active').forEach(function(n){n.classList.remove('active')});progress.style.width='0'}
  function tone(kind){if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();var now=audio.currentTime,osc=audio.createOscillator(),gain=audio.createGain(),filter=audio.createBiquadFilter();osc.type='sine';osc.frequency.value=kind==='low'?392:659.25;filter.type='lowpass';filter.frequency.value=kind==='low'?1200:1900;gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(kind==='low'?.20:.14,now+.008);gain.gain.exponentialRampToValueAtTime(.0001,now+.72);osc.connect(filter);filter.connect(gain);gain.connect(audio.destination);osc.start(now);osc.stop(now+.75)}
  function flash(kind,selector,index){var hammer=kind==='low'?lowHammer:highHammer,gong=kind==='low'?lowGong:highGong;hammer.classList.add('hit');gong.classList.add('ring');tone(kind);var n=document.querySelector(selector+' .note[data-index="'+index+'"]');if(n)n.classList.add('active');timers.push(setTimeout(function(){hammer.classList.remove('hit');gong.classList.remove('ring');if(n)n.classList.remove('active')},150))}
  function sequence(){var p=parts(),events=[],t=0;for(var i=0;i<p.h;i++){events.push({t:t,k:'low',s:'#hoursNotes',i:i});t+=330}if(p.q||p.r)t+=360;for(var j=0;j<p.q;j++){events.push({t:t,k:'high',s:'#quartersNotes',i:j});events.push({t:t+125,k:'low',s:'#quartersNotes',i:j});t+=410}if(p.r&&p.q)t+=320;for(var m=0;m<p.r;m++){events.push({t:t,k:'high',s:'#minutesNotes',i:m});t+=300}return{events:events,duration:Math.max(t,450)}}
  function play(){clear();running=true;machine.classList.add('armed');setStatus('armed');timers.push(setTimeout(function(){machine.classList.remove('armed');setStatus('striking',D.striking+': '+timeEl.textContent);var s=sequence();s.events.forEach(function(e,n){timers.push(setTimeout(function(){flash(e.k,e.s,e.i);progress.style.width=Math.round((n+1)/s.events.length*100)+'%'},e.t))});timers.push(setTimeout(function(){running=false;setStatus('done');progress.style.width='100%'},s.duration+180))},560))}
  function change(delta){clear();value=(value+delta+720)%720;render()}
  document.getElementById('hourMinus').onclick=function(){change(-60)};document.getElementById('hourPlus').onclick=function(){change(60)};document.getElementById('minuteMinus').onclick=function(){change(-1)};document.getElementById('minutePlus').onclick=function(){change(1)};document.getElementById('presetOne').onclick=function(){clear();value=10*60+37;render()};document.getElementById('presetTwo').onclick=function(){clear();value=12*60+59;render()};playBtn.onclick=play;document.getElementById('stopBtn').onclick=function(){clear();setStatus('ready')};document.getElementById('nowBtn').onclick=function(){var d=new Date();clear();value=(d.getHours()%12)*60+d.getMinutes();render()};themeBtn.onclick=function(){setDark(!document.body.classList.contains('dark'))};
  if(matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches)setDark(true);themeLabel();render();
  if(window.parent!==window){window.addEventListener('message',function(e){if(e.source===window.parent&&e.data&&e.data.type==='lume:lights')setDark(!!e.data.dark)});var last=0;function report(){var h=Math.ceil(document.querySelector('.card').getBoundingClientRect().height)+30;if(h!==last){last=h;parent.postMessage({type:'lume:height',height:h},'*')}}new ResizeObserver(report).observe(document.querySelector('.card'));addEventListener('load',report);report();parent.postMessage({type:'lume:ready'},'*')}
})();
</script>
</body>
</html>
